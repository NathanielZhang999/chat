            ) ? readSuppressionToken : null;
            if (!ownedToken) return;
            const activeSuppressionToken = activeRequest?.suppressionToken;
            const canTransferToActiveRefresh = activeRequest?.target === data.serverCode &&
                activeRequest.forceRefresh === true && activeRequest.suppressAutoRead === true &&
                activeSuppressionToken?.roomCode === data.serverCode &&
                activeSuppressionToken.blockVersion === data.blockVersion;
            if (canTransferToActiveRefresh) {
                readSuppressionToken = ChatClientHelpers.rebindSuppressionToken(
                    activeSuppressionToken,
                    data.serverCode,
                    currentRoomGeneration
                );
                return;
            }
            disarmReadSuppression(ownedToken);

        const pending = pendingMetadataOperation;
        if (!pending || data.serverCode !== pending.payload.serverCode ||
            data.description !== pending.payload.description || data.rules !== pending.payload.rules ||
            !operationReceipts.settleFromEvent(pending.receiptToken, pending.identity)) return false;
        roomInfoSave.disabled = false;
        roomInfoEditing = false;
        renderRoomInfo();
        return true;
    }

    function isCurrentRoomTimedOut() {
        return Boolean(currentServerCode &&
            currentRestrictionState.roomCode === currentServerCode &&
            currentRestrictionState.timedOut === true);
    }

    function hasPinManagementRoleInCurrentRoom() {
        return myRole === 'admin' || myRoomRole === 'mod' ||
            serversCache[currentServerCode]?.owner === myUsername;
    }

    function canManagePinsInCurrentRoom() {
        return !isCurrentRoomTimedOut() && hasPinManagementRoleInCurrentRoom();
    }

    function configureActiveRoomMutation(control) {
        if (!control) return control;
        control.setAttribute('data-active-room-required', 'true');
        if (isCurrentRoomTimedOut()) {
            control.hidden = true;
            if (!control.disabled) control.dataset.timeoutDisabled = 'true';
            control.disabled = true;
        }
        return control;
    }

    function syncMessageActionAvailability() {
        const timedOut = isCurrentRoomTimedOut();
        for (const control of document.querySelectorAll('[data-active-room-required="true"]')) {
            control.hidden = timedOut;
            if (timedOut) {
                if (!control.disabled) control.dataset.timeoutDisabled = 'true';
                control.disabled = true;
            } else if (control.dataset.timeoutDisabled === 'true') {
                control.disabled = false;
                delete control.dataset.timeoutDisabled;
            }
        }
    }

    function renderPins() {
        const list = document.getElementById('pins-list');
        const snapshot = pinsByRoom.get(currentServerCode);
        list.textContent = '';
        if (!snapshot?.pinsLoaded) {
            ChatClientHelpers.appendTextElement(document, list, 'p', 'empty-state', 'Loading pinned messages…');
            return;
        }
        if (!snapshot.pins.length) {
            ChatClientHelpers.appendTextElement(document, list, 'p', 'empty-state', 'No pinned messages.');
            return;
        }
        const canManagePins = canManagePinsInCurrentRoom();
        for (const pin of snapshot.pins) {
            const row = document.createElement('article');
            row.className = 'pin-row';
            const summary = document.createElement('div');
            summary.className = 'pin-summary';
            ChatClientHelpers.appendTextElement(document, summary, 'strong', '', pin.displayName || pin.username || 'Member');
            ChatClientHelpers.appendTextElement(
                document,
                summary,
                'span',
                '',
                pin.text || pin.attachmentSummary || 'Pinned message'
            );
            row.appendChild(summary);
            if (canManagePins) {
                const unpin = ChatClientHelpers.appendTextElement(document, row, 'button', 'ctx-btn danger', 'Unpin');
                unpin.type = 'button';
                unpin.onclick = () => setMessagePinned(pin.messageId, false, unpin);
            }
            list.appendChild(row);
        }
    }

    function openPins(trigger = document.getElementById('pins-btn')) {
        const roomCode = currentServerCode;
        if (!roomCode || !socket) return false;
        featureGenerations.invalidate('pins');
        pinsDialogController.open(trigger);
        renderPins();
        const token = featureGenerations.begin('pins', roomCode);
        const context = compositionContextCoordinator.current();
        socket.emit('list_pinned_messages', {
            serverCode: roomCode,
            clientContextId: context.clientContextId
        }, response => {
            if (!featureGenerations.isCurrent(token, roomCode)) return;
            response = response || { error: 'No response from server.' };
            if (response.error) {
                const list = document.getElementById('pins-list');
                list.textContent = '';
                ChatClientHelpers.appendTextElement(document, list, 'p', 'moderation-error', response.error);
                return;
            }
            const current = pinsByRoom.get(roomCode);
            const hydrated = ChatClientHelpers.acceptPinBodies(current, {
                ...response,
                requestTokenCurrent: true
            });
            if (hydrated === current) return;
            pinsByRoom.set(roomCode, hydrated);
            syncMessagePinControls(roomCode);
            renderPins();
        });
        return true;
    }

    function closePins() {
        return pinsDialogController.close();
    }

    function setMessagePinControlState(control, pinned) {
        if (!control?.dataset?.messageId) return false;
        return ChatClientHelpers.syncPinActionControls([control], null, {
            messageId: control.dataset.messageId,
            pinned
        }) === 1;
    }

    function updateMessagePinControlState(serverCode, messageId, pinned) {
        if (serverCode !== currentServerCode || !messageId || typeof pinned !== 'boolean') return false;
        return ChatClientHelpers.syncPinActionControls(
            document.querySelectorAll('.message-pin-action[data-message-id]'),
            null,
            { messageId: String(messageId), pinned }
        ) > 0;
    }

    function syncMessagePinControls(serverCode = currentServerCode) {
        if (serverCode !== currentServerCode) return false;
        const snapshot = pinsByRoom.get(serverCode);
        if (!snapshot?.pinsLoaded) return false;
        ChatClientHelpers.syncPinActionControls(
            document.querySelectorAll('.message-pin-action[data-message-id]'),
            snapshot
        );
        return true;
    }

    function updatePinsButton() {
        const snapshot = pinsByRoom.get(currentServerCode);
        const count = snapshot?.pinCount || 0;
        document.getElementById('pins-count').textContent = count > 99 ? '99+' : String(count);
        document.getElementById('pins-btn').setAttribute(
            'aria-label',
            `Pinned messages, ${count} pin${count === 1 ? '' : 's'}`
        );
    }

    function setMessagePinned(messageId, pinned, control) {
        if (isCurrentRoomTimedOut() || !canManagePinsInCurrentRoom()) return;
        const context = compositionContextCoordinator.current();
        if (!context.roomCode || !messageId) return;
        const payload = {
            serverCode: context.roomCode,
            clientContextId: context.clientContextId,
            messageId,
            pinned
        };
        const identity = JSON.stringify(payload);
        const receiptToken = operationReceipts.begin('pin', identity);
        const generationToken = featureGenerations.begin('pin-action', context.roomCode);
        pendingPinOperation = { receiptToken, generationToken, identity, payload, control };
        if (control) control.disabled = true;
        socket.emit('set_message_pin', payload, response => {
            if (!featureGenerations.isCurrent(generationToken, context.roomCode) ||
                !operationReceipts.canFinish(receiptToken, identity)) return;
            response = response || { error: 'No response from server.' };
            if (response.error) {
                if (control?.isConnected) control.disabled = false;
                operationReceipts.finish(receiptToken, identity);
                pendingPinOperation = null;
                showAppAlert('Pin update failed', response.error);
                return;
            }
            const accepted = acceptPinSnapshot(response);
            if (accepted) updateMessagePinControlState(
                payload.serverCode,
                payload.messageId,
                payload.pinned
            );
            operationReceipts.finish(receiptToken, identity);
            pendingPinOperation = null;
            if (control?.isConnected) control.disabled = false;
        });
    }

    function settlePinControlFromEvent(data) {
        const pending = pendingPinOperation;
        if (!pending || data.messageId !== pending.payload.messageId ||
            data.pinned !== pending.payload.pinned ||
            !operationReceipts.settleFromEvent(pending.receiptToken, pending.identity)) return false;
        if (pending.control?.isConnected) pending.control.disabled = false;
        return true;
    }

    function setUserBlocked(username, blocked, control) {
        if (!username || username === myUsername) return;
        const payload = { username, blocked };
        const identity = JSON.stringify({ username: username.toLowerCase(), blocked });
        const receiptToken = operationReceipts.begin('block', identity);
        pendingBlockOperation = { receiptToken, identity, payload, control };
        if (control) control.disabled = true;
        socket.emit('set_user_block', payload, response => {
            if (!operationReceipts.canFinish(receiptToken, identity)) return;
            response = response || { error: 'No response from server.' };
            if (response.error) {
                if (control?.isConnected) control.disabled = false;
                operationReceipts.finish(receiptToken, identity);
                pendingBlockOperation = null;
                showAppAlert('Block update failed', response.error);
                return;
            }
            applyAcceptedBlockState(response);
            operationReceipts.finish(receiptToken, identity);
            pendingBlockOperation = null;
            if (control?.isConnected) control.disabled = false;
        });
    }

    function settleBlockControlFromEvent(data) {
        const pending = pendingBlockOperation;
        if (!pending || data.usernameKey !== pending.payload.username.toLowerCase() ||
            blockedUsersByKey.has(data.usernameKey) !== pending.payload.blocked ||
            !operationReceipts.settleFromEvent(pending.receiptToken, pending.identity)) return false;
        if (pending.control?.isConnected) pending.control.disabled = false;
        return true;
    }

            closeModeration: closeModerationPrompt,

            closeCenter: closeModeratorCenter,

                document.getElementById('moderator-center-btn').style.display = 'none';

    function invalidateRevokedRoomState(data) {
        if (!currentServerCode || !data) return false;
        const stillAccessible = ChatClientHelpers.isRoomRailAccessible({
            serverCode: currentServerCode,
            role: myRole,
            joinedServers: myJoinedServers,
            bannedRooms: Array.isArray(data.bannedRooms) ? data.bannedRooms : [...myBannedRooms]
        });
        if (data.serverCode === currentServerCode && stillAccessible) return false;
        enterLobby();
        return true;

    function renderServerAccess() {
        document.querySelectorAll('.server-icon').forEach(icon => {
            if (icon.classList.contains('add-btn')) return;
            const code = icon.id === 'srv-global' ? 'global' : icon.id.replace(/^srv-/, '');
            const banned = myBannedRooms.has(code);
            const accessible = ChatClientHelpers.isRoomRailAccessible({
                serverCode: code,
                role: myRole,
                joinedServers: myJoinedServers,
                bannedRooms: [...myBannedRooms]
            });
            icon.setAttribute('aria-disabled', accessible ? 'false' : 'true');
            if (!accessible) {
                icon.title = banned ? 'You are banned from this room' : 'Join this room to open it';
                icon.classList.remove('active');
            } else {
                icon.removeAttribute('title');
            }
            if (code !== 'global' && myRole === 'admin' && !myJoinedServers.includes(code) && !banned) {
                icon.style.opacity = '0.4';
                icon.style.border = '1px dashed #8e9297';
            } else {
                icon.style.opacity = '';
                icon.style.border = '';
            }
        });
    }

        return Boolean(currentServerCode) && (myRole === 'admin' ||
            (currentServerCode !== 'global' && myRoomRole === 'mod'));

    function openModerationPrompt({ targetUsername, action, roomCode = currentServerCode, onSuccess = null }) {
        if (!targetUsername || !roomCode || !moderationActionLabels[action]) return;
        const identity = JSON.stringify({ roomCode, targetUsername, action });
        moderationDialogCoordinator.open(identity);
        selectedModerationRequest = { targetUsername, action, roomCode, onSuccess, identity };
        document.getElementById('moderation-action-confirm').disabled = false;
        const roomName = serversCache[roomCode]?.name || roomCode;
        document.getElementById('moderation-action-title').textContent = moderationActionLabels[action];
        document.getElementById('moderation-action-context').textContent =
            `${moderationActionLabels[action]} @${targetUsername} in ${roomName} (${roomCode})`;
        document.getElementById('moderation-duration-group').style.display = action === 'timeout' ? 'block' : 'none';
        document.getElementById('moderation-duration').value = '10m';
        document.getElementById('moderation-reason').value = '';
        document.getElementById('moderation-action-error').textContent = '';
        document.getElementById('moderation-action-modal').classList.add('active');
        document.getElementById('moderation-reason').focus();
    }

    function submitModerationAction() {
        if (!selectedModerationRequest) return;
        const request = selectedModerationRequest;
        if (currentServerCode !== request.roomCode && moderatorCenterRoom !== request.roomCode) {
            closeModerationPrompt();
            return;
        }
        const normalized = ChatClientHelpers.normalizeModerationPrompt({
            action: request.action,
            reason: document.getElementById('moderation-reason').value,
            duration: document.getElementById('moderation-duration').value
        });
        if (!normalized) {
            document.getElementById('moderation-action-error').textContent =
                'Enter a reason of 1–200 characters and choose a valid duration.';
            return;
        }
        const token = moderationDialogCoordinator.begin(request.identity);
        if (!token) return;
        socket.emit('moderate_user', {
            serverCode: request.roomCode,
            targetUser: request.targetUsername,
            action: normalized.action,
            duration: normalized.duration,
            reason: normalized.reason
        }, response => {
            if (!moderationDialogCoordinator.finish(token)) return;
            const result = response || { error: 'No response from server.' };
            if (result.error) {
                showAppAlert('Moderation failed', result.error);
                return;
            }
            closeModerationPrompt();
            showAppAlert('Moderation applied', 'The room restriction was updated.');
            if (typeof request.onSuccess === 'function') request.onSuccess();
        });
    }

        document.getElementById('report-modal').classList.remove('active');

        document.getElementById('report-error').textContent = '';

    function openReportPrompt(targetUsername, messageId = null) {
        if (!targetUsername || targetUsername === myUsername || !currentServerCode) return;
        const roomCode = currentServerCode;
        const identity = JSON.stringify({ roomCode, targetUsername, messageId });
        reportDialogCoordinator.open(identity);
        selectedReportRequest = { targetUsername, messageId, roomCode, identity };
        document.getElementById('report-confirm').disabled = false;
        document.getElementById('report-title').textContent = messageId ? 'Report Message' : 'Report User';
        document.getElementById('report-context').textContent = messageId
            ? `Report a message from @${targetUsername} in ${currentServerCode}`
            : `Report @${targetUsername} in ${currentServerCode}`;
        document.getElementById('report-reason').value = '';
        document.getElementById('report-error').textContent = '';
        document.getElementById('report-modal').classList.add('active');
        document.getElementById('report-reason').focus();
    }

    function submitReport() {
        if (!selectedReportRequest) return;
        const request = selectedReportRequest;
        const payload = ChatClientHelpers.normalizeReportPrompt({
            serverCode: request.roomCode,
            targetUser: request.targetUsername,
            messageId: request.messageId || undefined,
            reason: document.getElementById('report-reason').value
        });
        if (!payload) {
            document.getElementById('report-error').textContent = 'Enter a reason of 1–300 characters.';
            return;
        }
        if (currentServerCode !== request.roomCode) {
            closeReportPrompt();
            return;
        }
        const token = reportDialogCoordinator.begin(request.identity);
        if (!token) return;
        ChatClientHelpers.dispatchModerationReport(socket, payload, response => {
            if (!reportDialogCoordinator.finish(token)) return;
            const result = response || { error: 'No response from server.' };
            if (result.error) return showAppAlert('Report failed', result.error);
            closeReportPrompt();
            showAppAlert('Report submitted', 'Moderators can now review this report.');
        });
    }

    function loadModeratorCenterTab(tab = moderatorCenterTab, before = null, append = false) {
        const requestedRoom = moderatorCenterRoom;
        const modal = document.getElementById('moderator-center-modal');
        if (!requestedRoom || currentServerCode !== requestedRoom || !modal.classList.contains('active')) return;
        const request = ChatClientHelpers.moderatorCenterRequestFor({
            tab,
            roomCode: requestedRoom,
            status: document.getElementById('moderator-report-status').value,
            before,
            append
        });
        if (!request) return;
        const renderers = {
            reports: renderModerationReports,
            restrictions: renderRoomRestrictions,
            audit: renderModerationAudit,
            automod: renderAutoModSettings
        };
        ChatClientHelpers.dispatchModeratorCenterRequest({
            coordinator: moderatorCenterCoordinator,
            socket,
            request,
            blockWhilePending: append,
            apply(response) {
                renderers[tab](response, append);
            }
        });
    }

    function renderModerationReports(response, append = false) {
        const list = document.getElementById('moderator-reports-list');
        if (!append) list.textContent = '';
        if (response.error) {
            const errorRow = document.createElement('div');
            errorRow.className = 'moderator-row-detail';
            errorRow.textContent = response.error;
            list.appendChild(errorRow);
        } else {
            for (const report of Array.isArray(response.items) ? response.items : []) {
                const { row } = ChatClientHelpers.appendModerationItemRow(
                    document, list, 'report', report, formatExactDate
                );
                if (report.status === 'open') {
                    const actions = document.createElement('div');
                    actions.className = 'moderator-row-actions';
                    for (const [status, label, danger] of [
                        ['resolved', 'Resolve', false],
                        ['dismissed', 'Dismiss', true]
                    ]) {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.textContent = label;
                        if (danger) button.className = 'danger';
                        button.onclick = () => openResolutionPrompt(report, status);
                        actions.appendChild(button);

            serverCode: request.roomCode,

            status: request.status,
            resolution: document.getElementById('resolution-reason').value
        });

            document.getElementById('resolution-error').textContent = 'Enter a resolution of 1–300 characters.';
            return;

        if (currentServerCode !== request.roomCode || moderatorCenterRoom !== request.roomCode) {
            closeResolutionPrompt();

        const token = resolutionDialogCoordinator.begin(request.identity);

            if (!resolutionDialogCoordinator.finish(token)) return;

        });

    // --- IMAGE UPLOAD COMPRESSOR ENGINE ---
    document.getElementById('file-upload').addEventListener('change', async (e) => {
        if (compositionDisabled) return;
        const file = e.target.files[0]; if (!file) return;
        if (!file.type.startsWith('image/')) return showAppAlert("Error", "Only image files are allowed.");
        
        if(file.size > 10 * 1024 * 1024) return showAppAlert("Error", "File too large. Max 10MB before compression.");
        const uploadContext = compositionContextCoordinator.payload();
        if (!uploadContext) return;
        const uploadEpoch = ++attachmentLoadEpoch;
        const isCurrentUpload = () => uploadEpoch === attachmentLoadEpoch &&
            !compositionDisabled && compositionContextCoordinator.matches(uploadContext);
        
        const reader = new FileReader();
        reader.onload = (event) => {
            if (!isCurrentUpload()) return;
            const img = new Image();
            img.onload = () => {
                if (!isCurrentUpload()) return;
                const canvas = document.createElement('canvas');
                let w = img.width; let h = img.height;
                const max = 800; 
                if (w > h && w > max) { h *= max / w; w = max; }
                else if (h > max) { w *= max / h; h = max; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                
                pendingAttachmentBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview-img').src = pendingAttachmentBase64;
                document.getElementById('attachment-preview').classList.add('show');
                msgInput.focus();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // --- HTML ESCAPE & BACKEND SMART PING PARSING ---
    function formatMessageText(text) {
        let safeText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        let autoEmbeds = [];
        safeText = safeText.replace(/(https?:\/\/[^\s]+)/g, (match) => {
            if (/\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i.test(match)) {
                let decodedUrl = match.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
                autoEmbeds.push(decodedUrl);
            }
            return `<a href="${match}" target="_blank" rel="noopener noreferrer" class="chat-link">${match}</a>`;
        });

        safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');     
        safeText = safeText.replace(/\*(.*?)\*/g, '<em>$1</em>');                 
        safeText = safeText.replace(/__(.*?)__/g, '<u>$1</u>');                   
        safeText = safeText.replace(/~~(.*?)~~/g, '<del>$1</del>');               
        safeText = safeText.replace(/`(.*?)`/g, '<code>$1</code>');               

        const pingResult = ChatClientHelpers.formatTrustedPings(safeText, myUsername, myDisplayName);
        safeText = pingResult.html;

        return { html: safeText, autoEmbeds: autoEmbeds, isPinged: pingResult.isPinged };
    }

        const dName = document.getElementById('displayname-input').value.trim();

        if (!isLoginMode && !dName) return showError('Please set a Display Name.', false);

        const url = ChatClientHelpers.normalizeBackendUrl(rawUrl);
        if (!url) return showError('Backend URL must use HTTP or HTTPS.', false);

        localStorage.setItem('pro_chat_user', user);
        
        authError.style.color = "var(--text)"; authError.textContent = "Connecting to server..."; authBtn.disabled = true;

        const previousSocket = socket;
        const replacement = ChatClientHelpers.replaceSocket(socket, socketUrl, url, io);
        socket = replacement.socket;
        socketUrl = replacement.socketUrl;
        if (socket !== previousSocket) {
            clearFeatureStateForSocketReplacement();
            compositionContextCoordinator.invalidate();
            closeModerationPrompt();
            closeReportPrompt();
            invalidatePrivilegedAccess();
            setupSocket(socket);
        }
        const authSocket = socket;

        const action = isLoginMode ? 'login' : 'register';
        const payload = isLoginMode ? { username: user, password: pass } : { username: user, password: pass, displayName: dName };
        
        const doAuth = () => {
            authSocket.emit(action, payload, (res) => {
                if (authSocket !== socket) return;
                authBtn.disabled = false;
                res = res || { error: 'No response from server.' };
                if (res.error) return showError(res.error, false);
                
                if (action === 'register') {
                    showError("Registered! You can now log in.", true);
                    document.getElementById('password-input').value = "";
                    setTimeout(() => document.getElementById('tab-login').click(), 1000);
                } else {
                    myUsername = res.username;
                    myDisplayName = res.displayName || res.username;
                    myRole = res.role || 'user';
                    myRoomRole = 'user'; 
                    myJoinedServers = res.joinedServers || ['global'];
                    roomAccessCoordinator.replaceBannedRooms(res.bannedRooms || []);
                    myAvatarUrl = res.avatarUrl || ''; 
                    myColor = res.color || '';
                    replaceFeatureStateFromLogin(res);
                    
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    document.getElementById('auth-modal').classList.remove('active');
                    renderServers(res.servers || []);
                    const initialCode = Object.prototype.hasOwnProperty.call(res, 'defaultServerCode')
                        ? res.defaultServerCode : 'global';
                    applyRestrictionState(res.restriction, initialCode);
                    if (initialCode) switchServer(initialCode);
                    else enterLobby();
                }
            });
        };
        if (pendingAuthSocket && pendingAuthConnectHandler) {
            pendingAuthSocket.off('connect', pendingAuthConnectHandler);
            pendingAuthSocket = null;
            pendingAuthConnectHandler = null;
        }
        if (authSocket.connected) {
            doAuth();
        } else {
            pendingAuthSocket = authSocket;
            pendingAuthConnectHandler = () => {
                pendingAuthSocket = null;
                pendingAuthConnectHandler = null;
                doAuth();
            };
            authSocket.once('connect', pendingAuthConnectHandler);
        }
    });

    function setupSocket(activeSocket) {
        ChatClientHelpers.bindConnectErrorRecovery({
            activeSocket,
            getCurrentSocket: () => socket,
            isAuthModalActive: () => authModal.classList.contains('active'),
            authButton: authBtn,
            showError
        });

        activeSocket.on('room_details_updated', (data) => {
            if (activeSocket !== socket) return;
            acceptRoomDetailsSnapshot(data);
            const current = data?.serverCode ? roomDetailsByCode.get(data.serverCode) : null;
            if (ChatClientHelpers.matchesCurrentVersionedSnapshot(current, data, 'metadata')) {
                settleMetadataControlFromEvent(data);
            }
        });

        activeSocket.on('message_pin_updated', (data) => {
            if (activeSocket !== socket) return;
            const accepted = acceptPinSnapshot(data);
            const pin = data && data.pin;
            if (accepted && pin?.serverCode) {
                updateMessagePinControlState(pin.serverCode, data.messageId, data.pinned);
            }
            const current = pin?.serverCode ? pinsByRoom.get(pin.serverCode) : null;
            if (ChatClientHelpers.matchesCurrentVersionedSnapshot(current, pin, 'pins')) {
                settlePinControlFromEvent(data || {});
            }
            if (accepted && pin?.serverCode === currentServerCode && pinsDialogController.isOpen()) {
                featureGenerations.invalidate('pins');
                openPins(document.getElementById('pins-btn'));
            }
        });

        activeSocket.on('room_notification_updated', (data) => {
            if (activeSocket !== socket) return;
            acceptRoomStateSnapshot(data);
        });

        activeSocket.on('room_read_updated', (data) => {
            if (activeSocket !== socket) return;
            acceptRoomStateSnapshot(data);
        });

        activeSocket.on('room_activity', (data) => {
            if (activeSocket !== socket) return;
            applyRoomActivitySnapshot(data);
        });

        activeSocket.on('room_attention_updated', (data) => {
            if (activeSocket !== socket) return;
            acceptRoomStateSnapshot(data);
        });

        activeSocket.on('user_block_updated', (data) => {
            if (activeSocket !== socket) return;
            applyAcceptedBlockState(data);
            settleBlockControlFromEvent(data || {});
        });

        activeSocket.on('room_refresh_required', (data) => {
            if (activeSocket !== socket) return;
            handleRoomRefreshRequired(data, activeSocket);
        });
        
        activeSocket.on('force_logout', (msg) => {
            localStorage.removeItem('pro_chat_user'); alert(msg || "You have been logged out remotely."); location.reload(); 
        });

        activeSocket.on('chat_message', (msg) => {
            if (activeSocket !== socket) return;
            if (!msg || msg.serverCode !== currentServerCode) return;
            ChatClientHelpers.dispatchRoomEvent(currentServerCode, data => {
                const isMe = data.username === myUsername;
                appendMessage(data, isMe);
                typingUsers.delete(data.username); updateTypingUI();
                scheduleMaybeMarkCurrentRoomRead();

                if (!isMe) {
                    const isPinged = ChatClientHelpers.hasTrustedPing(data.text, myUsername, myDisplayName);
                    const level = roomStateByCode.get(currentServerCode)?.notificationLevel || 'all';
                    const sound = ChatClientHelpers.soundPolicy(level, isPinged, data.blocked === true);
                    if (sound) playSound(sound);
                }
            }, msg);
        });
        
        activeSocket.on('system_message', (txt) => {
            ChatClientHelpers.dispatchRoomEvent(currentServerCode, appendSystemMessage, txt);
        });

        activeSocket.on('global_role_updated', (data) => {
            if (data.username === myUsername) {
                myRole = data.role;
                if (data.role !== 'admin') invalidatePrivilegedAccess();
                renderServerAccess();
                showAppAlert(data.role === 'admin' ? "Promoted!" : "Demoted", `You have been ${data.role === 'admin' ? 'promoted to' : 'demoted from'} Global Admin!`);
                if (currentServerCode) roomSwitchCoordinator.request(currentServerCode);
                else updateModeratorCenterAccess();
            }
        });
        
        activeSocket.on('room_role_updated', (data) => {
            if (data.username === myUsername && data.targetServer === currentServerCode) {
                myRoomRole = 'user';
                invalidatePrivilegedAccess();
                roomSwitchCoordinator.request(currentServerCode);
            }
        });

        activeSocket.on('room_access_updated', (data) => {
            if (!data || data.username !== myUsername) return;
            closeModerationPrompt();
            closeReportPrompt();
            closeResolutionPrompt();
            myJoinedServers = Array.isArray(data.joinedServers) ? data.joinedServers : ['global'];
            invalidateRevokedRoomState(data);
            roomAccessCoordinator.handleAccessUpdate(data);
        });

        activeSocket.on('room_restriction_updated', (data) => {
            if (data && data.serverCode === currentServerCode && data.banned) enterLobby();
            roomAccessCoordinator.handleRestrictionUpdate(data);
        });

        activeSocket.on('moderation_queue_updated', (data) => {
            if (!data || data.serverCode !== moderatorCenterRoom ||
                currentServerCode !== moderatorCenterRoom ||
                !document.getElementById('moderator-center-modal').classList.contains('active')) return;
            loadModeratorCenterTab(moderatorCenterTab);
        });

        activeSocket.on('message_blocked', (data) => {
            const context = compositionContextCoordinator.current();
            if (!ChatClientHelpers.shouldDisplayMessageBlocked({
                data,
                currentServerCode,
                clientContextId: context.clientContextId
            })) return;
            showAppAlert('Message blocked', "Your message was blocked by this room's content policy.");
        });
        
        activeSocket.on('profile_updated', (data) => {
            if (data.username === myUsername) { myColor = data.color; myAvatarUrl = data.avatarUrl; myDisplayName = data.displayName || data.username; }
            document.querySelectorAll(`.msg[data-author="${data.username}"]`).forEach(el => {
                if (el.classList.contains('deleted-compact')) return;
                
                const authorDiv = el.querySelector('.msg-author');
                const avatarDiv = el.querySelector('.msg-avatar');
                if(!authorDiv || !avatarDiv) return;
                
                const cToUse = data.color || getUserColor(data.username);
                authorDiv.textContent = data.displayName || data.username;
                authorDiv.style.color = cToUse;
                
                if (data.avatarUrl) {
                    avatarDiv.style.background = 'transparent';
                    avatarDiv.innerHTML = '';
                    const img = document.createElement('img'); img.src = data.avatarUrl;
                    img.onerror = () => { img.style.display='none'; avatarDiv.textContent=(data.displayName||data.username).charAt(0).toUpperCase(); avatarDiv.style.background=cToUse; };
                    avatarDiv.appendChild(img);
                } else {
                    avatarDiv.innerHTML = '';
                    avatarDiv.textContent = (data.displayName||data.username).charAt(0).toUpperCase();
                    avatarDiv.style.background = cToUse;
                }
            });
        });

        activeSocket.on('message_edited', (data) => {
            document.querySelectorAll(`.msg[data-id="${data.id}"]`).forEach(el => {
                el.setAttribute('data-raw-text', data.text); 
                el.classList.remove('pinged'); 
                
                const { html, autoEmbeds, isPinged } = formatMessageText(data.text);
                
                const oldSpan = el.querySelector('.msg-text-content');
                if (oldSpan) {
                    oldSpan.innerHTML = html;
                    el.querySelectorAll('.auto-embed-img, .auto-embed-br').forEach(e => e.remove());
                    autoEmbeds.forEach(src => {
                        const imgEl = document.createElement('img');
                        imgEl.src = src; imgEl.className = 'chat-img auto-embed-img';
                        imgEl.onclick = () => window.open(src, '_blank');
                        const br = document.createElement('br'); br.className = 'auto-embed-br';
                        oldSpan.appendChild(br); oldSpan.appendChild(imgEl);
                    });
                }
                
                // Show Highlight Border For Everyone if edited to contain a ping meant for YOU
                if (isPinged && data.username !== myUsername) el.classList.add('pinged');

                if (!el.querySelector('.edited-tag')) {
                    const textDiv = el.querySelector('.msg-text');
                    if (textDiv) {
                        const tag = document.createElement('span'); tag.className = 'edited-tag'; tag.textContent = '(edited)';
                        const canEditMsg = data.username === myUsername || myRole === 'admin' || (currentServerCode !== 'global' && myRoomRole === 'mod');
                        if (canEditMsg) { 
                            tag.title = "View edit history"; tag.onclick = () => viewHistory(data.id); 
                        } else { tag.style.cursor = 'default'; tag.style.textDecoration = 'none'; }
                        textDiv.appendChild(tag);
                    }
                }
            });
        });

        activeSocket.on('message_deleted', (id) => {
            document.querySelectorAll(`.msg[data-id="${id}"]`).forEach(el => {
                const authorName = el.getAttribute('data-display') || el.getAttribute('data-author') || 'Someone';
                const isMe = el.getAttribute('data-author') === myUsername;
                
                el.style.animation = 'none';
                el.offsetHeight; 
                el.style.animation = 'messageSlideIn var(--motion-base) var(--ease-standard) forwards';
                
                el.className = 'msg deleted-compact is-deleted';
                el.textContent = '';
                const deletedIcon = ChatClientHelpers.appendTextElement(document, el, 'span', '', '🗑️');
                deletedIcon.style.marginRight = '6px';
                deletedIcon.style.fontSize = '0.9rem';
                ChatClientHelpers.appendTextElement(document, el, 'span', 'deleted-text', `${authorName} deleted a message.`);
                
                if (isMe || myRole === 'admin' || myRoomRole === 'mod') {
                    const viewTag = document.createElement('span'); 
                    viewTag.className = 'view-deleted-tag'; 
                    viewTag.textContent = '(view original)';
                    viewTag.onclick = () => viewDeleted(id); 
                    el.appendChild(viewTag);
                }
            }); 
        });

        activeSocket.on('reaction_updated', (data) => {
            const msgEl = document.querySelector(`.msg[data-id="${data.id}"]`);
            if (msgEl && !msgEl.classList.contains('deleted-compact')) {
                let container = msgEl.querySelector('.msg-reactions');
                if (!container) {
                    container = document.createElement('div');
                    container.className = 'msg-reactions';
                    const bodyDiv = msgEl.querySelector('.msg-body');
                    if(bodyDiv) bodyDiv.appendChild(container);
                }
                renderReactions(container, data.reactions, data.id);
            }
        });
        
        activeSocket.on('admin_new_server', (srv) => { if (myRole === 'admin') addServerToList(srv.code, srv.name, srv.owner); });

        activeSocket.on('server_deleted', (code) => {
            myJoinedServers = myJoinedServers.filter(c => c !== code);
            const icon = document.getElementById(`srv-${code}`);
            if (icon) icon.remove();
            
            if (currentServerCode === code) {
                if (myBannedRooms.has('global')) enterLobby();
                else switchServer('global');
                showAppAlert("Server Deleted", "The server you were viewing was permanently deleted by its Owner or a Global Admin.");
            }
        });

        // --- ONLINE USERS RENDERER & ROLE SYNC ---
        activeSocket.on('online_users', (users) => {
            ChatClientHelpers.dispatchRoomEvent(currentServerCode, roomUsers => {
            const list = document.getElementById('online-list');
            list.innerHTML = '';
            
            usersCache = {}; // Rebuild local lookup

            const me = roomUsers.find(u => u.username === myUsername);
            if (me) {
                myRoomRole = me.roomRole || 'user';
                updateModeratorCenterAccess();
            } else if (myRole !== 'admin') {
                myRoomRole = 'user';
                invalidatePrivilegedAccess();
            }

            const isGlobal = currentServerCode === 'global';
            const roomType = isGlobal ? 'Global Online' : 'Room Members';
            
            const onlineCount = roomUsers.filter(u => u.online !== false).length;
            const totalCount = roomUsers.length;
            
            const isHiddenAdmin = myRole === 'admin' && !myJoinedServers.includes(currentServerCode) && !isGlobal;
            const displayCount = isGlobal ? onlineCount + (isHiddenAdmin ? 1 : 0) : totalCount + (isHiddenAdmin ? 1 : 0);
            
            const onlineHeader = document.getElementById('online-header');
            onlineHeader.textContent = `${roomType} — `;
            const countSpan = ChatClientHelpers.appendTextElement(document, onlineHeader, 'span', '', displayCount);
            countSpan.id = 'online-count';

            if (isHiddenAdmin) {
                const li = document.createElement('li'); 
                li.className = "user-item stealth-admin"; 
                const avatar = ChatClientHelpers.appendTextElement(document, li, 'div', 'avatar', 'A');
                avatar.style.background = 'var(--error)';
                const statusDot = ChatClientHelpers.appendTextElement(document, avatar, 'div', 'status-dot online', '');
                statusDot.style.background = 'var(--warning)';
                const ghostLabel = ChatClientHelpers.appendTextElement(document, li, 'div', '', `${myDisplayName} (Ghost)`);
                ghostLabel.style.color = 'var(--warning)';
                ghostLabel.style.fontStyle = 'italic';
                list.appendChild(li);
                usersCache[myUsername] = myDisplayName;
            }

            roomUsers.forEach((u, index) => {
                usersCache[u.username] = u.displayName || u.username;

                const li = createMemberMenuTrigger(u, index);
                if (u.online === false && !isGlobal) li.classList.add('offline');
                
                const cToUse = u.color || getUserColor(u.username);
                const dotClass = u.online !== false ? 'online' : 'offline';
                const dName = u.displayName || u.username;

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (u.avatarUrl && /^https?:\/\//i.test(u.avatarUrl)) {
                    avatar.style.background = 'transparent';
                    const img = document.createElement('img');
                    img.src = u.avatarUrl;
                    img.onerror = () => {
                        img.remove();
                        avatar.textContent = dName.charAt(0).toUpperCase();
                        avatar.style.background = cToUse;
                        avatar.appendChild(statusDot);
                    };
                    avatar.appendChild(img);
                } else {
                    avatar.style.background = cToUse;
                    avatar.textContent = dName.charAt(0).toUpperCase();
                }
                const statusDot = document.createElement('div');
                statusDot.className = `status-dot ${dotClass}`;
                avatar.appendChild(statusDot);
                li.appendChild(avatar);

                const userLabel = ChatClientHelpers.appendTextElement(document, li, 'div', '', `${dName}${u.username === myUsername ? " (You)" : ""}`);
                userLabel.style.color = cToUse;
                userLabel.style.fontWeight = '600';
                if (u.role === 'admin') {
                    const badge = ChatClientHelpers.appendTextElement(document, userLabel, 'span', 'admin-badge', 'ADMIN');
                    badge.style.background = '#ed4245';
                    badge.style.borderColor = '#ed4245';
                    badge.style.fontSize = '0.5rem';
                    badge.style.marginLeft = '8px';
                } else if (!isGlobal && u.roomRole === 'mod') {
                    const badge = ChatClientHelpers.appendTextElement(document, userLabel, 'span', 'admin-badge mod-badge', 'MOD');
                    badge.style.fontSize = '0.5rem';
                    badge.style.marginLeft = '8px';
                }
                
                list.appendChild(li);
            });
            }, users);
        });

        activeSocket.on('typing', (data) => {
            ChatClientHelpers.dispatchRoomEvent(currentServerCode, typing => {
                if (typing.isTyping) typingUsers.set(typing.username, ChatClientHelpers.typingDisplayName(typing));
                else typingUsers.delete(typing.username);
                updateTypingUI();
            }, data);
        });
    }

    // --- CONTEXT MENU MANAGER (PROFILES & ROLES) ---
    function createMemberMenuTrigger(u, index) {
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'user-item member-trigger';
        trigger.style.animationDelay = `${index * 30}ms`;
        trigger.setAttribute('aria-haspopup', 'menu');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-label', `Actions for ${u.displayName || u.username}`);
        trigger.onclick = event => openRoleManager(event, u, trigger);
        trigger.onkeydown = event => {
            if (!['Enter', ' '].includes(event.key)) return;
            event.preventDefault();
            openRoleManager(event, u, trigger);
        };
        return trigger;
    }

    function createAuthorMenuTrigger(data, kind = 'author') {
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = kind === 'avatar' ? 'msg-avatar author-trigger' : 'msg-author author-trigger';
        trigger.setAttribute('aria-haspopup', 'menu');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-label', `Actions for ${data.displayName || data.username}`);
        trigger.onclick = event => openRoleManager(event, data, trigger);
        trigger.onkeydown = event => {
            if (!['Enter', ' '].includes(event.key)) return;
            event.preventDefault();
            openRoleManager(event, data, trigger);
        };
        return trigger;
    }

    function createMessageMenuTrigger(actions, wrapper) {
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'message-menu-trigger';
        trigger.textContent = 'More';
        trigger.setAttribute('aria-haspopup', 'menu');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-label', 'Message actions');
        actions.setAttribute('role', 'menu');
        actions.hidden = true;
        const controller = ChatClientHelpers.createMenuController({
            menu: actions,
            documentTarget: document,
            getItems: () => actions.querySelectorAll('.action-btn'),
            onOpen: () => wrapper.classList.add('keyboard-actions-open'),
            onClose: () => wrapper.classList.remove('keyboard-actions-open')
        });
        trigger.onclick = () => controller.toggle(trigger);
        trigger.onkeydown = event => controller.handleTriggerKeydown(event, trigger);
        return trigger;
    }

    function openRoleManager(e, u, suppliedTrigger = null) {
        e.stopPropagation();
        closeRoleManager();
        if (!currentServerCode || !u || !u.username) return;
        const requestedRoom = currentServerCode;
        const trigger = suppliedTrigger || e.currentTarget;

        const menu = document.createElement('div');
        menu.id = 'user-context-menu';
        menu.className = 'context-menu';
        menu.setAttribute('role', 'menu');
        menu.setAttribute('aria-hidden', 'true');
        menu.hidden = true;

        // Profile Display Header
        const header = document.createElement('div');
        header.className = 'ctx-header';
        ChatClientHelpers.appendTextElement(document, header, 'div', 'd-name', u.displayName || u.username);
        ChatClientHelpers.appendTextElement(document, header, 'div', 'u-name', `@${u.username}`);
        menu.appendChild(header);

        const isGlobalAdmin = myRole === 'admin';
        const isExactRoomMod = requestedRoom !== 'global' && myRoomRole === 'mod';
        let optionsAdded = false;

        const createBtn = (text, onClick, isDanger=false) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('role', 'menuitem');
            btn.className = 'ctx-btn' + (isDanger ? ' danger' : '');
            btn.textContent = text;
            btn.style.display = 'block';
            btn.onclick = () => { closeRoleManager(); onClick(); };
            return btn;
        };
        
        if (u.username !== myUsername) {
            menu.appendChild(createBtn('Report User', () => openReportPrompt(u.username)));
            optionsAdded = true;

            const blockAction = ChatClientHelpers.blockActionFor({
                username: u.username,
                isSelf: false,
                blocked: blockedUsersByKey.has(String(u.username).toLowerCase())
            });
            if (blockAction) {
                menu.appendChild(createBtn(blockAction.label, () => {
                    setUserBlocked(u.username, blockAction.blocked, trigger);
                }, blockAction.blocked));
                optionsAdded = true;
            }

            // --- GLOBAL ADMIN ACTIONS ---
            if (isGlobalAdmin) {
                if (u.role !== 'admin') {
                    menu.appendChild(createBtn('Promote to Global Admin', () => {
                        socket.emit('manage_role', { targetUser: u.username, action: 'promote_global_admin' }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                    }));
                    optionsAdded = true;
                } else if (u.username.toLowerCase() !== 'nyzhang1') {
                    menu.appendChild(createBtn('Remove Global Admin', () => {
                        socket.emit('manage_role', { targetUser: u.username, action: 'demote_global_admin' }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                    }, true));
                    optionsAdded = true;
                }
            } 
            
            // --- ROOM MODERATOR ACTIONS ---
            if (requestedRoom !== 'global') {
                if (isGlobalAdmin || isExactRoomMod) {
                    if (u.roomRole !== 'mod' && u.role !== 'admin') {
                        menu.appendChild(createBtn('Promote to Room Moderator', () => {
                            socket.emit('manage_role', { targetUser: u.username, action: 'promote_mod', serverCode: requestedRoom }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                        }));
                        optionsAdded = true;
                    }
                }
                if (isGlobalAdmin) { // Only Global Admins can demote moderators
                    if (u.roomRole === 'mod' && u.role !== 'admin') {
                        menu.appendChild(createBtn('Remove Room Moderator', () => {
                            socket.emit('manage_role', { targetUser: u.username, action: 'demote_mod', serverCode: requestedRoom }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                        }, true));
                        optionsAdded = true;
                    }
                }
            }

            if (isGlobalAdmin || isExactRoomMod) {
                socket.emit('list_room_restrictions', {
                    serverCode: requestedRoom,
                    targetUser: u.username,
                    limit: 1
                }, response => {
                    if (currentServerCode !== requestedRoom || !menu.isConnected) return;
                    const result = response || { error: 'No response from server.' };
                    if (result.error) return;
                    const restriction = Array.isArray(result.items) && result.items[0] ? result.items[0] : {};
                    const moderationActions = ChatClientHelpers.moderationActionsFor({
                        serverCode: requestedRoom,
                        actorRole: myRole,
                        actorRoomRole: myRoomRole,
                        targetRole: u.role || 'user',
                        targetRoomRole: u.roomRole || 'user',
                        targetIsBanned: Boolean(restriction.banned),
                        targetIsTimedOut: Boolean(restriction.timedOut),
                        targetUsername: u.username,
                        isSelf: u.username === myUsername
                    });
                    for (const action of moderationActions) {
                        menu.appendChild(createBtn(moderationActionLabels[action], () => {
                            openModerationPrompt({ targetUsername: u.username, action, roomCode: requestedRoom });
                        }, action === 'kick' || action === 'ban'));
                    }
                });
            }
        }

        if (!optionsAdded) {
            const noActions = document.createElement('div');
            noActions.style.padding = '8px 12px';
            noActions.style.fontSize = '0.75rem';
            noActions.style.color = 'var(--text-muted)';
            noActions.textContent = 'No actions available';
            menu.appendChild(noActions);
        }

        document.body.appendChild(menu);
        
        const triggerRect = typeof trigger?.getBoundingClientRect === 'function'
            ? trigger.getBoundingClientRect() : { left: 8, bottom: 8 };
        let x = Number.isFinite(e.clientX) ? e.clientX : triggerRect.left;
        let y = Number.isFinite(e.clientY) ? e.clientY : triggerRect.bottom;
        if (x + menu.offsetWidth > window.innerWidth) x -= menu.offsetWidth;
        if (y + menu.offsetHeight > window.innerHeight) y -= menu.offsetHeight;
        
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        activeRoleMenuElement = menu;
        activeRoleMenuController = ChatClientHelpers.createMenuController({
            menu,
            documentTarget: document,
            getItems: () => menu.querySelectorAll('.ctx-btn'),
            onClose() {
                ChatClientHelpers.removeAfterBaseMotion(setTimeout, () => menu.remove());
                if (activeRoleMenuElement === menu) {
                    activeRoleMenuElement = null;
                    activeRoleMenuController = null;
                }
            }
        });
        activeRoleMenuController.open(trigger);
    }

    // --- REACTION UI ENGINE ---
    function renderReactions(container, reactions, msgId) {
        container.innerHTML = '';
        if (!reactions || Object.keys(reactions).length === 0) {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'flex';
        
        for (const [emoji, users] of Object.entries(reactions)) {
            if (!users || users.length === 0) continue;
            
            const bubble = document.createElement('button');
            bubble.type = 'button';
            configureActiveRoomMutation(bubble);
            const hasReacted = users.includes(myUsername);
            bubble.className = `reaction-bubble ${hasReacted ? 'reacted' : ''}`;
            bubble.textContent = `${emoji} ${users.length}`;
            
            let tooltipNames = users.slice(0, 5).join(', ');
            if (users.length > 5) tooltipNames += ` and ${users.length - 5} others`;
            bubble.title = tooltipNames;

            bubble.onclick = () => {
                if (!currentServerCode || isCurrentRoomTimedOut()) return;
                const payload = compositionContextCoordinator.payload({ id: msgId, emoji });
                if (payload) socket.emit('toggle_reaction', payload);
            };
            container.appendChild(bubble);
        }
    }

    function toggleServerModal(mode) {
        document.getElementById('sm-join-ui').classList.toggle('active', mode === 'join');
        document.getElementById('sm-create-ui').classList.toggle('active', mode === 'create');
        document.getElementById('sm-title').textContent = mode === 'join' ? 'Join a Server' : 'Create a Server';
    }

    function renderServers(servers) {
        if (!servers || !Array.isArray(servers)) return; 
        document.getElementById('dynamic-servers').textContent = '';
        serversCache = { global: { code: 'global', name: 'Global Chat', owner: 'System' } };
        servers.forEach(s => {
            if (!s?.code) return;
            if (s.code === 'global') serversCache.global = { ...serversCache.global, ...s };
            else addServerToList(s.code, s.name, s.owner, s);
        });
        renderServerAccess();
        for (const code of Object.keys(serversCache)) renderRoomAttention(code);
    }

    function addServerToList(code, name, owner, summary = {}) {
        serversCache[code] = { code, name, owner, ...summary };
        if(document.getElementById(`srv-${code}`)) return;
        
        const icon = document.createElement('button');
        icon.type = 'button';
        icon.className = 'server-icon';
        icon.id = `srv-${code}`;
        icon.setAttribute('aria-label', name || code);
        icon.style.background = getUserColor(code); 
        icon.textContent = name.substring(0, 2).toUpperCase();
        ChatClientHelpers.appendTextElement(document, icon, 'span', 'tooltip', name);
        icon.onclick = () => switchServer(code);
        
        if (myRole === 'admin' && !myJoinedServers.includes(code) && code !== 'global') { icon.style.opacity = '0.4'; icon.style.border = '1px dashed #8e9297'; }
        document.getElementById('dynamic-servers').appendChild(icon);
        renderServerAccess();
        renderRoomAttention(code);
    }

    function requestServerSwitch(code, options = {}) {
        if (currentServerCode === code && chatWindow.innerHTML !== '' &&
            !roomSwitchCoordinator.isPending() && options.forceRefresh !== true) return null;
        return roomSwitchCoordinator.request(code, options);
    }

    function supersedeJoinedRoomInfoIntent(roomCode, origin) {
        if (origin === 'user' && pendingJoinedRoomInfoIntent) {
            pendingJoinedRoomInfoIntent = null;
        }
    }

    function switchServer(code, options = { origin: 'user' }) {
        if (!ChatClientHelpers.isRoomRailAccessible({
            serverCode: code,
            role: myRole,
            joinedServers: myJoinedServers,
            bannedRooms: [...myBannedRooms]
        })) return false;
        supersedeJoinedRoomInfoIntent(code, options.origin);
        return roomAccessCoordinator.requestRoom(code, options);
    }

    function queueJoinedRoomInfoIntent(roomCode, switchToken, trigger) {
        if (!roomCode || !switchToken) return false;
        pendingJoinedRoomInfoIntent = Object.freeze({ roomCode, switchToken, trigger });
        return true;
    }

    function consumeJoinedRoomInfoIntent(roomCode, switchToken) {
        const intent = pendingJoinedRoomInfoIntent;
        if (!intent || intent.roomCode !== roomCode || intent.switchToken !== switchToken) return false;
        pendingJoinedRoomInfoIntent = null;
        openRoomInfo(intent.trigger);
        return true;
    }

    function handleSwitchResult(code, res, switchToken, options = {}) {
        let acceptedSuppressionToken = null;
        const outcome = ChatClientHelpers.applySwitchResult({
            currentServerCode,
            targetServerCode: code,
            response: res,
            acceptedBlockVersion,
            showAlert: showAppAlert,
            applySuccess(targetServerCode, response) {
                const srv = serversCache[targetServerCode] || { name: 'Unknown', owner: '' };
                const isStealth = myRole === 'admin' && !myJoinedServers.includes(targetServerCode) && targetServerCode !== 'global';

                invalidateRoomScopedFeatureCallbacks();
                closeModeratorCenter();
                closeModerationPrompt();
                closeReportPrompt();
                closeRoomInfo();
                closePins();
                closeRoleManager();
                currentServerCode = targetServerCode;
                compositionContextCoordinator.activate(targetServerCode);
                const activeRoomToken = featureGenerations.begin('active-room', targetServerCode);
                currentRoomGeneration = activeRoomToken.generation;
                if (readSuppressionToken?.roomCode === targetServerCode) {
                    readSuppressionToken = ChatClientHelpers.rebindSuppressionToken(
                        readSuppressionToken,
                        targetServerCode,
                        currentRoomGeneration
                    );
                    if (options.suppressAutoRead === true &&
                        ChatClientHelpers.sameSuppressionOwner(
                            readSuppressionToken,
                            options.suppressionToken
                        )) {
                        acceptedSuppressionToken = readSuppressionToken;
                    }
                }
                myRoomRole = response.roomRole || 'user';
                if (response.details) acceptRoomDetailsSnapshot({
                    ...response.details,
                    serverCode: targetServerCode
                });
                if (response.pin) acceptPinSnapshot(response.pin);
                if (response.notification) acceptRoomStateSnapshot(response.notification);
                applyRestrictionState(response.restriction, targetServerCode);
                renderServerAccess();
                updateModeratorCenterAccess();
                updatePinsButton();

                document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active'));
                const activeIcon = document.getElementById(`srv-${targetServerCode}`);
                if(activeIcon) activeIcon.classList.add('active');

                typingUsers.clear();
                updateTypingUI();

                const inviteBtn = document.getElementById('invite-code-btn');
                const leaveBtn = document.getElementById('leave-server-btn');
                const deleteBtn = document.getElementById('delete-server-btn');
                const joinBtn = document.getElementById('join-server-btn');
                if (targetServerCode === 'global') {
                    inviteBtn.style.display = 'none'; leaveBtn.style.display = 'none'; joinBtn.style.display = 'none'; deleteBtn.style.display = 'none';
                } else {
                    inviteBtn.style.display = 'block';
                    inviteBtn.textContent = `Copy Code: ${targetServerCode}`;

                    if (myRole === 'admin' || (srv.owner && srv.owner === myUsername)) deleteBtn.style.display = 'block';
                    else deleteBtn.style.display = 'none';

                    if (myJoinedServers.includes(targetServerCode)) {
                        leaveBtn.style.display = 'block'; joinBtn.style.display = 'none';
                    } else {
                        leaveBtn.style.display = 'none'; joinBtn.style.display = 'block';
                    }
                }
                document.getElementById('room-info-btn').disabled = false;
                document.getElementById('pins-btn').disabled = false;
                syncHeaderOverflowActions();

                chatWindow.textContent = '';
                cancelAction();

                const serverTitle = document.getElementById('server-title');
                serverTitle.textContent = '';
                ChatClientHelpers.appendTextElement(document, serverTitle, 'span', '', srv.name);
                if (myRole === 'admin') {
                    const badge = ChatClientHelpers.appendTextElement(document, serverTitle, 'span', 'admin-badge', 'ADMIN');
                    badge.style.background = '#ed4245';
                    badge.style.borderColor = '#ed4245';
                } else if (myRoomRole === 'mod') {
                    const badge = ChatClientHelpers.appendTextElement(document, serverTitle, 'span', 'admin-badge mod-badge', 'MOD');
                    badge.title = 'Moderator';
                    badge.style.background = '#faa61a';
                    badge.style.borderColor = '#d58512';
                }
                if (isStealth) {
                    const ghost = ChatClientHelpers.appendTextElement(document, serverTitle, 'span', '', '(Ghost)');
                    ghost.style.color = 'var(--warning)';
                    ghost.style.fontSize = '0.8rem';
                    ghost.style.fontStyle = 'italic';
                }

                if (response.history) loadHistory(response.history);
                consumeJoinedRoomInfoIntent(targetServerCode, switchToken);
                if (options.suppressAutoRead === true) {
                    if (acceptedSuppressionToken) {
                        ChatClientHelpers.scheduleAfterScrollFrame(
                            scheduleAnimationFrame,
                            () => {
                                const ownedToken = ChatClientHelpers.sameSuppressionOwner(
                                    readSuppressionToken,
                                    acceptedSuppressionToken
                                ) ? readSuppressionToken : null;
                                disarmReadSuppression(ownedToken || acceptedSuppressionToken);
                            }
                        );
                    }
                } else {
                    scheduleMaybeMarkCurrentRoomRead();
                }
            }
        });
        if (!outcome.accepted && options.suppressAutoRead === true) {
            const ownedToken = ChatClientHelpers.sameSuppressionOwner(
                readSuppressionToken,
                options.suppressionToken
            ) ? readSuppressionToken : null;
            if (ownedToken) disarmReadSuppression(ownedToken);
            else disarmReadSuppression(options.suppressionToken);
        }
        return outcome;
    }

    function copyCode() {
        navigator.clipboard.writeText(currentServerCode);
        showAppAlert("Copied", `Invite Code copied to clipboard: ${currentServerCode}`);
    }

    async function leaveServer() {
        if (currentServerCode === 'global') return;
        const serverCode = currentServerCode;
        if (!(await showAppConfirm("Leave Server", "Are you sure you want to leave this server?", "Leave", true))) return;

        socket.emit('leave_server', serverCode, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            myJoinedServers = myJoinedServers.filter(c => c !== serverCode);
            
            const icon = document.getElementById(`srv-${serverCode}`);
            if (myRole !== 'admin' && icon) {
                icon.remove();
                if (currentServerCode === serverCode) {
                    if (myBannedRooms.has('global')) enterLobby();
                    else switchServer('global');
                }
            } else if (icon) {
                icon.style.opacity = '0.4'; icon.style.border = '1px dashed #8e9297';
                if (currentServerCode === serverCode) switchServer(serverCode);
            }
        });
    }

    async function deleteServer() {
        if (currentServerCode === 'global') return;
        const serverCode = currentServerCode;
        const srvName = serversCache[serverCode].name;
        
        if (await showAppConfirm("Delete Server", `🚨 PERMANENT WARNING 🚨\n\nAre you sure you want to completely destroy "${srvName}"?\n\nAll messages will be wiped forever.`, "Delete Permanently", true)) {
            socket.emit('delete_server', serverCode, (res) => {
                res = res || { error: 'No response from server.' };
                if (res.error) showAppAlert("Error", res.error);
            });
        }
    }

    function joinFromSnoop() {
        const serverCode = currentServerCode;
        const joinSocket = socket;
        joinSocket.emit('join_server', serverCode, (res) => {
            if (joinSocket !== socket) return;
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            if (!myJoinedServers.includes(res.server.code)) myJoinedServers.push(res.server.code);
            const icon = document.getElementById(`srv-${res.server.code}`);
            if (icon) { icon.style.opacity = '1'; icon.style.border = 'none'; }
            const switchToken = switchServer(res.server.code, { origin: 'join', forceRefresh: true });
            queueJoinedRoomInfoIntent(res.server.code, switchToken, document.getElementById('join-server-btn'));
        });
    }

    // --- COMPOSE & SLASH COMMANDS ---
    document.getElementById('compose').addEventListener('submit', (e) => {
        e.preventDefault();
        if (compositionDisabled || !currentServerCode) return;
        let text = msgInput.value.trim();
        
        if (text === '/clear') {
            chatWindow.innerHTML = '';
            cancelAction();
            return;
        } else if (text.startsWith('/shrug')) {
            text = text.replace(/^\/shrug\s*/, '') + ' ¯\\_(ツ)_/¯';
            text = text.trim();
        } else if (text.startsWith('/tableflip')) {
            text = text.replace(/^\/tableflip\s*/, '') + ' (╯°□°）╯︵ ┻━┻';
            text = text.trim();
        } else if (text.startsWith('/unflip')) {
            text = text.replace(/^\/unflip\s*/, '') + ' ┬─┬ ノ( ゜-゜ノ)';
            text = text.trim();
        }

        if (!text && !pendingAttachmentBase64) return;
        if (!socket?.connected) return;

        if (editingMsgId) {
            const payload = compositionContextCoordinator.payload({ id: editingMsgId, text });
            if (!payload) return;
            socket.emit('edit_message', payload);
            cancelAction();
        } else {
            const payload = compositionContextCoordinator.payload({
                text,
                attachment: pendingAttachmentBase64
            });
            if (!payload) return;
            if (replyingToData) payload.replyTo = replyingToData;
            socket.emit('chat_message', payload);
            cancelAction();
        }
        
        const stoppedTyping = compositionContextCoordinator.payload({ isTyping: false });
        if (stoppedTyping) socket.emit('typing', stoppedTyping);
        msgInput.focus();
    });

    msgInput.addEventListener('input', () => {
        if (compositionDisabled || !currentServerCode) return;
        const typingStarted = compositionContextCoordinator.payload({ isTyping: true });
        if (!typingStarted) return;
        socket.emit('typing', typingStarted);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            if (!compositionContextCoordinator.matches(typingStarted)) return;
            socket.emit('typing', {
                serverCode: typingStarted.serverCode,
                clientContextId: typingStarted.clientContextId,
                isTyping: false
            });
        }, 1500);
    });

    function initiateEdit(id, currentTextElement) {
        if (!currentTextElement || !currentServerCode || isCurrentRoomTimedOut()) return;
        cancelAction();
        editingMsgId = id; document.getElementById('info-bar').classList.add('show'); 
        
        const rawText = document.querySelector(`.msg[data-id="${id}"]`).getAttribute('data-raw-text') || "";
        
        // Convert internal {{PING:...}} tokens back to raw readable @DisplayName for the input field
        const editText = rawText.replace(/\{\{PING:(.*?)\|(.*?)\}\}/g, '@$2');
        
        document.getElementById('info-bar-text').textContent = '✏️ Editing Message';
        msgInput.value = editText;
        msgInput.focus(); sendBtn.textContent = 'Save'; sendBtn.style.background = '#4752c4';
    }

    function initiateReply(id, displayname, currentTextElement) {
        if (!currentTextElement || !currentServerCode || isCurrentRoomTimedOut()) return;
        cancelAction(); 
        
        let rawText = document.querySelector(`.msg[data-id="${id}"]`).getAttribute('data-raw-text') || "";
        rawText = rawText.replace(/\{\{PING:(.*?)\|(.*?)\}\}/g, '@$2');
        let shortText = rawText.length > 50 ? rawText.substring(0, 50) + '...' : rawText;
        if (!shortText) shortText = "Image Attachment";
        
        replyingToData = { id, displayname, text: shortText };
        document.getElementById('info-bar').classList.add('show'); 
        const infoText = document.getElementById('info-bar-text');
        infoText.textContent = '↳ Replying to ';
        ChatClientHelpers.appendTextElement(document, infoText, 'strong', '', `@${displayname}`);
        msgInput.focus();
    }
    
    function cancelAction() {
        editingMsgId = null; replyingToData = null; clearAttachment();
        document.getElementById('info-bar').classList.remove('show'); msgInput.value = '';
        sendBtn.textContent = 'Send'; sendBtn.style.background = 'var(--primary)';

        document.getElementById('reaction-picker').classList.remove('show');

    function viewHistory(msgId) {
        socket.emit('get_edit_history', msgId, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            const list = document.getElementById('history-list'); list.innerHTML = '';
            document.getElementById('history-modal-title').textContent = "Message Edit History";

            if (!res.history || res.history.length === 0) { list.innerHTML = '<div class="hist-item" style="border-left-color: var(--text-muted);">No previous edits.</div>'; }
            else {
                res.history.forEach((item, index) => {
                    const el = document.createElement('div'); el.className = 'hist-item';
                    const timeDiv = document.createElement('div'); timeDiv.className = 'hist-time';
                    timeDiv.textContent = `Version ${index + 1} • ${formatExactDate(item.timestamp)}`;
                    const textDiv = document.createElement('div'); textDiv.className = 'hist-text';
                    
                    const { html } = formatMessageText(item.text);
                    const span = document.createElement('span'); span.innerHTML = html;
                    textDiv.appendChild(span);
                    
                    el.appendChild(timeDiv); el.appendChild(textDiv); list.appendChild(el);
                });
            }
            document.getElementById('history-modal').classList.add('active');
        });

    function viewDeleted(msgId) {
        socket.emit('get_deleted_message', msgId, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            const list = document.getElementById('history-list'); list.innerHTML = '';
            document.getElementById('history-modal-title').textContent = "Deleted Message";

            const el = document.createElement('div'); el.className = 'hist-item';
            
            const timeDiv = document.createElement('div'); timeDiv.className = 'hist-time';
            timeDiv.textContent = `Original Content`;

            const textDiv = document.createElement('div'); textDiv.className = 'hist-text';
            if(res.text) {
                const { html } = formatMessageText(res.text);
                const span = document.createElement('span'); span.innerHTML = html;
                textDiv.appendChild(span);
            }
            const safeAttachment = ChatClientHelpers.sanitizeAttachment(res.attachment);
            if(safeAttachment) {
                const imgEl = document.createElement('img'); imgEl.className = 'chat-img'; imgEl.src = safeAttachment;
                textDiv.appendChild(document.createElement('br')); textDiv.appendChild(imgEl);
            }

            el.appendChild(timeDiv); el.appendChild(textDiv); list.appendChild(el);
            document.getElementById('history-modal').classList.add('active');
        });
