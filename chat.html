            const isHiddenAdmin = myRole === 'admin' && !myJoinedServers.includes(currentServerCode) && !isGlobal;
            const displayCount = isGlobal ? onlineCount + (isHiddenAdmin ? 1 : 0) : totalCount + (isHiddenAdmin ? 1 : 0);
            
            const onlineHeader = document.getElementById('online-header');
            onlineHeader.textContent = `${roomType} — `;
            const countSpan = ChatClientHelpers.appendTextElement(document, onlineHeader, 'span', '', displayCount);
            countSpan.id = 'online-count';

            if (isHiddenAdmin) {
                const li = document.createElement('li'); 
                li.className = "user-item stealth-admin"; 
                const avatar = ChatClientHelpers.appendTextElement(document, li, 'div', 'avatar', 'A');
                avatar.style.background = 'var(--error)';
                const statusDot = ChatClientHelpers.appendTextElement(document, avatar, 'div', 'status-dot online', '');
                statusDot.style.background = 'var(--warning)';
                const ghostLabel = ChatClientHelpers.appendTextElement(document, li, 'div', '', `${myDisplayName} (Ghost)`);
                ghostLabel.style.color = 'var(--warning)';
                ghostLabel.style.fontStyle = 'italic';
                list.appendChild(li);
                usersCache[myUsername] = myDisplayName;
            }

            roomUsers.forEach((u, index) => {
                usersCache[u.username] = u.displayName || u.username;

                const li = document.createElement('li');
                li.className = "user-item";
                if (u.online === false && !isGlobal) li.classList.add('offline');
                li.style.animationDelay = `${index * 30}ms`; 
                
                const cToUse = u.color || getUserColor(u.username);
                const dotClass = u.online !== false ? 'online' : 'offline';
                const dName = u.displayName || u.username;

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (u.avatarUrl && /^https?:\/\//i.test(u.avatarUrl)) {
                    avatar.style.background = 'transparent';
                    const img = document.createElement('img');
                    img.src = u.avatarUrl;
                    img.onerror = () => {
                        img.remove();
                        avatar.textContent = dName.charAt(0).toUpperCase();
                        avatar.style.background = cToUse;
                        avatar.appendChild(statusDot);
                    };
                    avatar.appendChild(img);
                } else {
                    avatar.style.background = cToUse;
                    avatar.textContent = dName.charAt(0).toUpperCase();
                }
                const statusDot = document.createElement('div');
                statusDot.className = `status-dot ${dotClass}`;
                avatar.appendChild(statusDot);
                li.appendChild(avatar);

                const userLabel = ChatClientHelpers.appendTextElement(document, li, 'div', '', `${dName}${u.username === myUsername ? " (You)" : ""}`);
                userLabel.style.color = cToUse;
                userLabel.style.fontWeight = '600';
                if (u.role === 'admin') {
                    const badge = ChatClientHelpers.appendTextElement(document, userLabel, 'span', 'admin-badge', 'ADMIN');
                    badge.style.background = '#ed4245';
                    badge.style.borderColor = '#ed4245';
                    badge.style.fontSize = '0.5rem';
                    badge.style.marginLeft = '8px';
                } else if (!isGlobal && u.roomRole === 'mod') {
                    const badge = ChatClientHelpers.appendTextElement(document, userLabel, 'span', 'admin-badge mod-badge', 'MOD');
                    badge.style.fontSize = '0.5rem';
                    badge.style.marginLeft = '8px';
                }
                
                li.onclick = (e) => { openRoleManager(e, u); };

                list.appendChild(li);
            });
            }, users);
        });

        activeSocket.on('typing', (data) => {
            ChatClientHelpers.dispatchRoomEvent(currentServerCode, typing => {
                if (typing.isTyping) typingUsers.set(typing.username, ChatClientHelpers.typingDisplayName(typing));
                else typingUsers.delete(typing.username);
                updateTypingUI();
            }, data);
        });
    }

    // --- CONTEXT MENU MANAGER (PROFILES & ROLES) ---
    function openRoleManager(e, u) {
        e.stopPropagation();
        const existing = document.getElementById('user-context-menu');
        if (existing) existing.remove();
        if (!currentServerCode || !u || !u.username) return;
        const requestedRoom = currentServerCode;

        const menu = document.createElement('div');
        menu.id = 'user-context-menu';
        menu.className = 'context-menu';
        menu.style.display = 'flex';

        // Profile Display Header
        const header = document.createElement('div');
        header.className = 'ctx-header';
        ChatClientHelpers.appendTextElement(document, header, 'div', 'd-name', u.displayName || u.username);
        ChatClientHelpers.appendTextElement(document, header, 'div', 'u-name', `@${u.username}`);
        menu.appendChild(header);

        const isGlobalAdmin = myRole === 'admin';
        const isExactRoomMod = requestedRoom !== 'global' && myRoomRole === 'mod';
        let optionsAdded = false;

        const createBtn = (text, onClick, isDanger=false) => {
            const btn = document.createElement('button');
            btn.className = 'ctx-btn' + (isDanger ? ' danger' : '');
            btn.textContent = text;
            btn.style.display = 'block';
            btn.onclick = () => { onClick(); menu.remove(); };
            return btn;
        };
        
        if (u.username !== myUsername) {
            menu.appendChild(createBtn('Report User', () => openReportPrompt(u.username)));
            optionsAdded = true;

            // --- GLOBAL ADMIN ACTIONS ---
            if (isGlobalAdmin) {
                if (u.role !== 'admin') {
                    menu.appendChild(createBtn('Promote to Global Admin', () => {
                        socket.emit('manage_role', { targetUser: u.username, action: 'promote_global_admin' }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                    }));
                    optionsAdded = true;
                } else if (u.username.toLowerCase() !== 'nyzhang1') {
                    menu.appendChild(createBtn('Remove Global Admin', () => {
                        socket.emit('manage_role', { targetUser: u.username, action: 'demote_global_admin' }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                    }, true));
                    optionsAdded = true;
                }
            } 
            
            // --- ROOM MODERATOR ACTIONS ---
            if (requestedRoom !== 'global') {
                if (isGlobalAdmin || isExactRoomMod) {
                    if (u.roomRole !== 'mod' && u.role !== 'admin') {
                        menu.appendChild(createBtn('Promote to Room Moderator', () => {
                            socket.emit('manage_role', { targetUser: u.username, action: 'promote_mod', serverCode: requestedRoom }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                        }));
                        optionsAdded = true;
                    }
                }
                if (isGlobalAdmin) { // Only Global Admins can demote moderators
                    if (u.roomRole === 'mod' && u.role !== 'admin') {
                        menu.appendChild(createBtn('Remove Room Moderator', () => {
                            socket.emit('manage_role', { targetUser: u.username, action: 'demote_mod', serverCode: requestedRoom }, (res) => { res = res || { error: 'No response from server.' }; if(res.error) showAppAlert('Error', res.error); });
                        }, true));
                        optionsAdded = true;
                    }
                }
            }

            if (isGlobalAdmin || isExactRoomMod) {
                socket.emit('list_room_restrictions', {
                    serverCode: requestedRoom,
                    targetUser: u.username,
                    limit: 1
                }, response => {
                    if (currentServerCode !== requestedRoom || !menu.isConnected) return;
                    const result = response || { error: 'No response from server.' };
                    if (result.error) return;
                    const restriction = Array.isArray(result.items) && result.items[0] ? result.items[0] : {};
                    const moderationActions = ChatClientHelpers.moderationActionsFor({
                        serverCode: requestedRoom,
                        actorRole: myRole,
                        actorRoomRole: myRoomRole,
                        targetRole: u.role || 'user',
                        targetRoomRole: u.roomRole || 'user',
                        targetIsBanned: Boolean(restriction.banned),
                        targetIsTimedOut: Boolean(restriction.timedOut),
                        targetUsername: u.username,
                        isSelf: u.username === myUsername
                    });
                    for (const action of moderationActions) {
                        menu.appendChild(createBtn(moderationActionLabels[action], () => {
                            openModerationPrompt({ targetUsername: u.username, action, roomCode: requestedRoom });
                        }, action === 'kick' || action === 'ban'));
                    }
                });
            }
        }

        if (!optionsAdded) {
            const noActions = document.createElement('div');
            noActions.style.padding = '8px 12px';
            noActions.style.fontSize = '0.75rem';
            noActions.style.color = 'var(--text-muted)';
            noActions.textContent = 'No actions available';
            menu.appendChild(noActions);
        }

        document.body.appendChild(menu);
        
        let x = e.clientX;
        let y = e.clientY;
        if (x + menu.offsetWidth > window.innerWidth) x -= menu.offsetWidth;
        if (y + menu.offsetHeight > window.innerHeight) y -= menu.offsetHeight;
        
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        
        requestAnimationFrame(() => menu.classList.add('show'));
        
        setTimeout(() => {
            document.addEventListener('click', function closeMenu(evt) {
                if (!menu.contains(evt.target)) {
                    menu.classList.remove('show');
                    ChatClientHelpers.removeAfterBaseMotion(setTimeout, () => menu.remove());
                    document.removeEventListener('click', closeMenu);
                }
            });
        }, 0);
    }

    // --- REACTION UI ENGINE ---
    function renderReactions(container, reactions, msgId) {
        container.innerHTML = '';
        if (!reactions || Object.keys(reactions).length === 0) {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'flex';
        
        for (const [emoji, users] of Object.entries(reactions)) {
            if (!users || users.length === 0) continue;
            
            const bubble = document.createElement('div');
            const hasReacted = users.includes(myUsername);
            bubble.className = `reaction-bubble ${hasReacted ? 'reacted' : ''}`;
            bubble.textContent = `${emoji} ${users.length}`;
            
            let tooltipNames = users.slice(0, 5).join(', ');
            if (users.length > 5) tooltipNames += ` and ${users.length - 5} others`;
            bubble.title = tooltipNames;

            bubble.onclick = () => {
                if (!currentServerCode) return;
                const payload = compositionContextCoordinator.payload({ id: msgId, emoji });
                if (payload) socket.emit('toggle_reaction', payload);
            };
            container.appendChild(bubble);
        }
    }

    function toggleServerModal(mode) {
        document.getElementById('sm-join-ui').classList.toggle('active', mode === 'join');
        document.getElementById('sm-create-ui').classList.toggle('active', mode === 'create');
        document.getElementById('sm-title').textContent = mode === 'join' ? 'Join a Server' : 'Create a Server';
    }

    function renderServers(servers) {
        if (!servers || !Array.isArray(servers)) return; 
        document.getElementById('dynamic-servers').textContent = '';
        serversCache = { global: { code: 'global', name: 'Global Chat', owner: 'System' } };
        servers.forEach(s => { if (s && s.code && s.code !== 'global') addServerToList(s.code, s.name, s.owner); });
        renderServerAccess();
    }

    function addServerToList(code, name, owner) {
        serversCache[code] = { code, name, owner };
        if(document.getElementById(`srv-${code}`)) return;
        
        const icon = document.createElement('div');
        icon.className = 'server-icon';
        icon.id = `srv-${code}`;
        icon.style.background = getUserColor(code); 
        icon.textContent = name.substring(0, 2).toUpperCase();
        ChatClientHelpers.appendTextElement(document, icon, 'div', 'tooltip', name);
        icon.onclick = () => switchServer(code);
        
        if (myRole === 'admin' && !myJoinedServers.includes(code) && code !== 'global') { icon.style.opacity = '0.4'; icon.style.border = '1px dashed #8e9297'; }
        document.getElementById('dynamic-servers').appendChild(icon);
        renderServerAccess();
    }

    function requestServerSwitch(code, { forceRefresh = false } = {}) {
        if (!forceRefresh && currentServerCode === code && chatWindow.querySelector('.msg, .system-msg') &&
            !roomSwitchCoordinator.isPending()) return;
        roomSwitchCoordinator.request(code);
    }

    function switchServer(code, options) {
        if (!ChatClientHelpers.isRoomRailAccessible({
            serverCode: code,
            role: myRole,
            joinedServers: myJoinedServers,
            bannedRooms: [...myBannedRooms]
        })) return false;
        return roomAccessCoordinator.requestRoom(code, options);
    }

    function handleSwitchResult(code, res) {
        return ChatClientHelpers.applySwitchResult({
            currentServerCode,
            targetServerCode: code,
            response: res,
            showAlert: showAppAlert,
            applySuccess(targetServerCode, response) {
                const srv = serversCache[targetServerCode] || { name: 'Unknown', owner: '' };
                const isStealth = myRole === 'admin' && !myJoinedServers.includes(targetServerCode) && targetServerCode !== 'global';

                invalidateMessageReads();
                closeModeratorCenter();
                closeModerationPrompt();
                closeReportPrompt();
                currentServerCode = targetServerCode;
                compositionContextCoordinator.activate(targetServerCode);
                messageReadCoordinator.activate(
                    targetServerCode,
                    compositionContextCoordinator.current().clientContextId,
                    response.nextCursor || null
                );
                myRoomRole = response.roomRole || 'user';
                applyRestrictionState(response.restriction, targetServerCode);
                renderServerAccess();
                updateModeratorCenterAccess();

                document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active'));
                const activeIcon = document.getElementById(`srv-${targetServerCode}`);
                if(activeIcon) activeIcon.classList.add('active');

                typingUsers.clear();
                updateTypingUI();

                const inviteBtn = document.getElementById('invite-code-btn');
                const leaveBtn = document.getElementById('leave-server-btn');
                const deleteBtn = document.getElementById('delete-server-btn');
                const joinBtn = document.getElementById('join-server-btn');
                if (targetServerCode === 'global') {
                    inviteBtn.style.display = 'none'; leaveBtn.style.display = 'none'; joinBtn.style.display = 'none'; deleteBtn.style.display = 'none';
                } else {
                    inviteBtn.style.display = 'block';
                    inviteBtn.textContent = `Copy Code: ${targetServerCode}`;

                    if (myRole === 'admin' || (srv.owner && srv.owner === myUsername)) deleteBtn.style.display = 'block';
                    else deleteBtn.style.display = 'none';

                    if (myJoinedServers.includes(targetServerCode)) {
                        leaveBtn.style.display = 'block'; joinBtn.style.display = 'none';
                    } else {
                        leaveBtn.style.display = 'none'; joinBtn.style.display = 'block';
                    }
                }

                cancelAction();

                const serverTitle = document.getElementById('server-title');
                serverTitle.textContent = '';
                ChatClientHelpers.appendTextElement(document, serverTitle, 'span', '', srv.name);
                if (myRole === 'admin') {
                    const badge = ChatClientHelpers.appendTextElement(document, serverTitle, 'span', 'admin-badge', 'ADMIN');
                    badge.style.background = '#ed4245';
                    badge.style.borderColor = '#ed4245';
                } else if (myRoomRole === 'mod') {
                    const badge = ChatClientHelpers.appendTextElement(document, serverTitle, 'span', 'admin-badge mod-badge', 'MOD');
                    badge.title = 'Moderator';
                    badge.style.background = '#faa61a';
                    badge.style.borderColor = '#d58512';
                }
                if (isStealth) {
                    const ghost = ChatClientHelpers.appendTextElement(document, serverTitle, 'span', '', '(Ghost)');
                    ghost.style.color = 'var(--warning)';
                    ghost.style.fontSize = '0.8rem';
                    ghost.style.fontStyle = 'italic';
                }

                loadHistory(response.history, { replace: true });
                renderOlderControl();
            }
        });
    }

    function copyCode() {
        navigator.clipboard.writeText(currentServerCode);
        showAppAlert("Copied", `Invite Code copied to clipboard: ${currentServerCode}`);
    }

    async function leaveServer() {
        if (currentServerCode === 'global') return;
        const serverCode = currentServerCode;
        if (!(await showAppConfirm("Leave Server", "Are you sure you want to leave this server?", "Leave", true))) return;

        socket.emit('leave_server', serverCode, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            myJoinedServers = myJoinedServers.filter(c => c !== serverCode);
            
            const icon = document.getElementById(`srv-${serverCode}`);
            if (myRole !== 'admin' && icon) {
                icon.remove();
            } else if (icon) {
                icon.style.opacity = '0.4'; icon.style.border = '1px dashed #8e9297';
            }
            if (currentServerCode !== serverCode) return;
            invalidateMessageReads();
            renderSearchControl();
            if (myRole === 'admin') switchServer(serverCode, { forceRefresh: true });
            else if (myBannedRooms.has('global')) enterLobby();
            else switchServer('global');
        });
    }

    async function deleteServer() {
        if (currentServerCode === 'global') return;
        const serverCode = currentServerCode;
        const srvName = serversCache[serverCode].name;
        
        if (await showAppConfirm("Delete Server", `🚨 PERMANENT WARNING 🚨\n\nAre you sure you want to completely destroy "${srvName}"?\n\nAll messages will be wiped forever.`, "Delete Permanently", true)) {
            socket.emit('delete_server', serverCode, (res) => {
                res = res || { error: 'No response from server.' };
                if (res.error) showAppAlert("Error", res.error);
            });
        }
    }

    function joinFromSnoop() {
        const serverCode = currentServerCode;
        socket.emit('join_server', serverCode, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            if (!myJoinedServers.includes(res.server.code)) myJoinedServers.push(res.server.code);
            const icon = document.getElementById(`srv-${res.server.code}`);
            if (icon) { icon.style.opacity = '1'; icon.style.border = 'none'; }
            switchServer(res.server.code);
        });
    }

    document.getElementById('submit-create-btn').onclick = () => {
        const name = document.getElementById('create-name').value.trim();
        if(!name) return;
        socket.emit('create_server', name, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            document.getElementById('server-modal').classList.remove('active'); document.getElementById('create-name').value = '';
            myJoinedServers.push(res.server.code);
            
            const existingIcon = document.getElementById(`srv-${res.server.code}`);
            if (existingIcon) { existingIcon.style.opacity = '1'; existingIcon.style.border = 'none'; }
            else { addServerToList(res.server.code, res.server.name, myUsername); } 
            
            switchServer(res.server.code);
        });
    };

    document.getElementById('submit-join-btn').onclick = () => {
        const code = document.getElementById('join-code').value.trim();
        if(!code) return;
        socket.emit('join_server', code, (res) => {
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            document.getElementById('server-modal').classList.remove('active'); document.getElementById('join-code').value = '';
            if (!myJoinedServers.includes(res.server.code)) myJoinedServers.push(res.server.code);
            
            const existingIcon = document.getElementById(`srv-${res.server.code}`);
            if (existingIcon) { existingIcon.style.opacity = '1'; existingIcon.style.border = 'none'; }
            else { addServerToList(res.server.code, res.server.name, res.server.owner); }
            
            switchServer(res.server.code);
        });
    };

    // --- COMPOSE & SLASH COMMANDS ---
    document.getElementById('compose').addEventListener('submit', (e) => {
        e.preventDefault();
        if (compositionDisabled || !currentServerCode) return;
        let text = msgInput.value.trim();
        
        if (text === '/clear') {
            clearRenderedMessages();
            cancelAction();
            return;
        } else if (text.startsWith('/shrug')) {
            text = text.replace(/^\/shrug\s*/, '') + ' ¯\\_(ツ)_/¯';
            text = text.trim();
        } else if (text.startsWith('/tableflip')) {
            text = text.replace(/^\/tableflip\s*/, '') + ' (╯°□°）╯︵ ┻━┻';
            text = text.trim();
        } else if (text.startsWith('/unflip')) {
            text = text.replace(/^\/unflip\s*/, '') + ' ┬─┬ ノ( ゜-゜ノ)';
            text = text.trim();
        }

        if (!text && !pendingAttachmentBase64) return;
        if (!socket?.connected) return;

        if (editingMsgId) {
            const payload = compositionContextCoordinator.payload({ id: editingMsgId, text });
            if (!payload) return;
            socket.emit('edit_message', payload);
            cancelAction();
        } else {
            const payload = compositionContextCoordinator.payload({
                text,
                attachment: pendingAttachmentBase64
            });
            if (!payload) return;
            if (replyingToData) payload.replyTo = replyingToData;
            socket.emit('chat_message', payload);
            cancelAction();
        }
        
        const stoppedTyping = compositionContextCoordinator.payload({ isTyping: false });
        if (stoppedTyping) socket.emit('typing', stoppedTyping);
        msgInput.focus();
    });

    msgInput.addEventListener('input', () => {
        if (compositionDisabled || !currentServerCode) return;
        const typingStarted = compositionContextCoordinator.payload({ isTyping: true });
        if (!typingStarted) return;
        socket.emit('typing', typingStarted);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            if (!compositionContextCoordinator.matches(typingStarted)) return;
            socket.emit('typing', {
                serverCode: typingStarted.serverCode,
                clientContextId: typingStarted.clientContextId,
                isTyping: false
            });
        }, 1500);
    });

    function initiateEdit(id, currentTextElement) {
        if (!currentTextElement || !currentServerCode) return;
        cancelAction();
        editingMsgId = id; document.getElementById('info-bar').classList.add('show'); 
        
        const rawText = document.querySelector(`.msg[data-id="${id}"]`).getAttribute('data-raw-text') || "";
        
        // Convert internal {{PING:...}} tokens back to raw readable @DisplayName for the input field
        const editText = rawText.replace(/\{\{PING:(.*?)\|(.*?)\}\}/g, '@$2');
        
        document.getElementById('info-bar-text').textContent = '✏️ Editing Message';
        msgInput.value = editText;
        msgInput.focus(); sendBtn.textContent = 'Save'; sendBtn.style.background = '#4752c4';
    }

    function initiateReply(id, displayname, currentTextElement) {
        if (!currentTextElement || !currentServerCode) return;
        cancelAction(); 
        
        let rawText = document.querySelector(`.msg[data-id="${id}"]`).getAttribute('data-raw-text') || "";
        rawText = rawText.replace(/\{\{PING:(.*?)\|(.*?)\}\}/g, '@$2');
        let shortText = rawText.length > 50 ? rawText.substring(0, 50) + '...' : rawText;
        if (!shortText) shortText = "Image Attachment";
        
        replyingToData = { id, displayname, text: shortText };
        document.getElementById('info-bar').classList.add('show'); 
        const infoText = document.getElementById('info-bar-text');
        infoText.textContent = '↳ Replying to ';
        ChatClientHelpers.appendTextElement(document, infoText, 'strong', '', `@${displayname}`);
        msgInput.focus();
    }
    
    function cancelAction() {
        editingMsgId = null; replyingToData = null; clearAttachment();
        document.getElementById('info-bar').classList.remove('show'); msgInput.value = '';
        sendBtn.textContent = 'Send'; sendBtn.style.background = 'var(--primary)';
        document.getElementById('emoji-picker').classList.remove('show');
        document.getElementById('reaction-picker').classList.remove('show');
        activeReactMessageId = null;
    }

    function viewHistory(msgId) {
        const token = messageReadCoordinator.beginDetail(msgId);
        if (!token) return;
        socket.emit('get_edit_history', msgId, (res) => {
            if (!messageReadCoordinator.finishDetail(token)) return;
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            const list = document.getElementById('history-list'); list.textContent = '';
            document.getElementById('history-modal-title').textContent = "Message Edit History";

            if (!res.history || res.history.length === 0) {
                const empty = ChatClientHelpers.appendTextElement(
                    document, list, 'div', 'hist-item', 'No previous edits.'
                );
                empty.style.borderLeftColor = 'var(--text-muted)';
            }
            else {
                res.history.forEach((item, index) => {
                    const el = document.createElement('div'); el.className = 'hist-item';
                    const timeDiv = document.createElement('div'); timeDiv.className = 'hist-time';
                    timeDiv.textContent = `Version ${index + 1} • ${formatExactDate(item.timestamp)}`;
                    const textDiv = document.createElement('div'); textDiv.className = 'hist-text';
                    
                    const { html } = formatMessageText(item.text);
                    const span = document.createElement('span'); span.innerHTML = html;
                    textDiv.appendChild(span);
                    
                    el.appendChild(timeDiv); el.appendChild(textDiv); list.appendChild(el);
                });
            }
            document.getElementById('history-modal').classList.add('active');
        });
    }

    function viewDeleted(msgId) {
        const token = messageReadCoordinator.beginDetail(msgId);
        if (!token) return;
        socket.emit('get_deleted_message', msgId, (res) => {
            if (!messageReadCoordinator.finishDetail(token)) return;
            res = res || { error: 'No response from server.' };
            if (res.error) return showAppAlert("Error", res.error);
            const list = document.getElementById('history-list'); list.textContent = '';
            document.getElementById('history-modal-title').textContent = "Deleted Message";

            const el = document.createElement('div'); el.className = 'hist-item';
            
            const timeDiv = document.createElement('div'); timeDiv.className = 'hist-time';
            timeDiv.textContent = `Original Content`;

            const textDiv = document.createElement('div'); textDiv.className = 'hist-text';
            if(res.text) {
                const { html } = formatMessageText(res.text);
                const span = document.createElement('span'); span.innerHTML = html;
                textDiv.appendChild(span);
            }
            const safeAttachment = ChatClientHelpers.sanitizeAttachment(res.attachment);
            if(safeAttachment) {
                const imgEl = document.createElement('img'); imgEl.className = 'chat-img'; imgEl.src = safeAttachment;
                textDiv.appendChild(document.createElement('br')); textDiv.appendChild(imgEl);
            }

            el.appendChild(timeDiv); el.appendChild(textDiv); list.appendChild(el);
            document.getElementById('history-modal').classList.add('active');
        });
    }

    function loadHistory(msgs, { replace = false } = {}) {
        if (replace) clearRenderedMessages();
        ChatClientHelpers.renderInitialMessagePage({
            messages: msgs,
            renderMessage(message, options) {
                appendMessage(message, message.username === myUsername, options);
            },
            requestScroll: behavior => chatScrollCoordinator.request(behavior)
        });
    }

    function loadOlderMessages() {
        const requestHandle = ChatClientHelpers.requestOlderMessages({
            coordinator: messageReadCoordinator,
            socket,
            scheduleTimeout: scheduleOlderAckTimeout,
            cancelTimeout: cancelOlderAckTimeout,
            timeoutMs: olderRequestTimeoutMs,
            onTimeout() {
                olderRequestHandle = null;
                renderOlderControl();
            },
            onAccepted(response, token) {
                olderRequestHandle = null;
                stopOlderAnchor();
                ChatClientHelpers.prependMessagePage({
                    chatWindow,
                    historyControls,
                    messages: response.messages,
                    renderMessage(message, before) {
                        return appendMessage(message, message.username === myUsername, {
                            history: true,
                            before
                        });
                    },
                    afterRender: renderOlderControl,
                    createResizeObserver: createOlderResizeObserver,
                    isCurrent: () => messageReadCoordinator.matches(token),
                    onAnchorCleanup(cleanup) { stopOlderAnchor = cleanup; }
                });
            }
        });
        olderRequestHandle = requestHandle || null;
        if (!messageReadCoordinator.current().olderPending) olderRequestHandle = null;
    }

    loadOlderButton.addEventListener('click', loadOlderMessages);

    function appendMessage(data, isMe, { history = false, before = null } = {}) {
        const renderPolicy = ChatClientHelpers.messageRenderPolicy({
            history,
            wasNearBottom: ChatClientHelpers.isNearScrollEnd(chatWindow)
        });
        const wrapper = document.createElement('div');
        wrapper.setAttribute('data-id', data._id); 
        wrapper.setAttribute('data-author', data.username);
        wrapper.setAttribute('data-display', data.displayName || data.username);
        wrapper.setAttribute('data-raw-text', data.text || ''); 

        // Both Global Admins and Room Mods can manage/edit messages
        const canManageMsg = isMe || myRole === 'admin' || (currentServerCode !== 'global' && myRoomRole === 'mod');
        const displayAuthorName = data.displayName || data.username;

        if (data.deleted) {
            wrapper.className = 'msg deleted-compact is-deleted';
            if (!renderPolicy.animate) wrapper.classList.add('no-enter-animation');
            const deletedIcon = ChatClientHelpers.appendTextElement(document, wrapper, 'span', '', '🗑️');
            deletedIcon.style.marginRight = '6px';
            deletedIcon.style.fontSize = '0.9rem';
            ChatClientHelpers.appendTextElement(document, wrapper, 'span', 'deleted-text', `${displayAuthorName} deleted a message.`);
            
            if (canManageMsg) {
                const viewTag = document.createElement('span'); 
                viewTag.className = 'view-deleted-tag'; 
                viewTag.textContent = '(view original)';
                viewTag.onclick = () => viewDeleted(data._id); 
                wrapper.appendChild(viewTag);
            }
            chatWindow.insertBefore(wrapper, before);
            if (renderPolicy.shouldScroll) chatScrollCoordinator.request(renderPolicy.behavior);
            return wrapper;
        }

        wrapper.className = `msg`; 
        if (!renderPolicy.animate) wrapper.classList.add('no-enter-animation');

        const avatarDiv = document.createElement('div'); 
        avatarDiv.className = 'msg-avatar';
        const colorToUse = data.color || getUserColor(data.username);
        
        if (data.avatarUrl) {
            avatarDiv.style.background = 'transparent';
            const img = document.createElement('img'); img.src = data.avatarUrl;
            img.onerror = () => { img.style.display='none'; avatarDiv.textContent=displayAuthorName.charAt(0).toUpperCase(); avatarDiv.style.background=colorToUse; };
            avatarDiv.appendChild(img);
        } else {
            avatarDiv.textContent = displayAuthorName.charAt(0).toUpperCase();
            avatarDiv.style.background = colorToUse;
        }

        const bodyDiv = document.createElement('div'); bodyDiv.className = 'msg-body';
        
        if (data.replyTo && data.replyTo.id) {
            const rb = document.createElement('div'); rb.className = 'reply-context';
            ChatClientHelpers.appendTextElement(document, rb, 'span', 'reply-author', `@${data.replyTo.displayname}`);
            const replyText = String(data.replyTo.text || '').replace(/\{\{PING:(.*?)\|(.*?)\}\}/g, '@$2');
            ChatClientHelpers.appendTextElement(document, rb, 'span', 'reply-text', replyText);
            
            rb.onclick = () => {
                const target = document.querySelector(`.msg[data-id="${data.replyTo.id}"]`);
                if (target && !target.classList.contains('deleted-compact')) { target.scrollIntoView({behavior: 'smooth', block: 'center'}); target.style.background = 'rgba(88, 101, 242, 0.2)'; setTimeout(()=>target.style.background='transparent', 1500); }
            };
            bodyDiv.appendChild(rb);
        }

        const header = document.createElement('div'); header.className = 'msg-header';
        
        const author = document.createElement('div'); author.className = 'msg-author'; 
        author.textContent = displayAuthorName; author.style.color = colorToUse;
        header.appendChild(author);

        if (data.role === 'admin' || data.username.toLowerCase() === 'nyzhang1') {
            const badge = ChatClientHelpers.appendTextElement(document, header, 'span', 'admin-badge', 'ADMIN');
            badge.style.background = '#ed4245';
            badge.style.borderColor = '#ed4245';
        } else if (data.roomRole === 'mod') {
            const badge = ChatClientHelpers.appendTextElement(document, header, 'span', 'admin-badge mod-badge', 'MOD');
            badge.style.background = '#faa61a';
            badge.style.borderColor = '#d58512';
        }

        const time = document.createElement('div'); time.className = 'msg-time-header';
        time.textContent = formatExactDate(data.timestamp); 
        header.appendChild(time);
        bodyDiv.appendChild(header);

        const textDiv = document.createElement('div'); textDiv.className = 'msg-text';

        const actions = document.createElement('div'); actions.className = 'msg-actions';
        
        const reactBtn = document.createElement('button'); reactBtn.className = 'action-btn react'; reactBtn.textContent = '😀 React';
        reactBtn.title = "Add a reaction";
        reactBtn.onclick = (e) => {
            e.stopPropagation();
            if (!currentServerCode) return;
            const picker = document.getElementById('reaction-picker');
            picker.style.left = Math.max(10, Math.min(e.clientX - 150, window.innerWidth - 300)) + 'px';
            picker.style.top = Math.min(e.clientY, window.innerHeight - 220) + 'px';
            document.getElementById('emoji-picker').classList.remove('show');
            picker.classList.add('show');
            activeReactMessageId = data._id;
        };
        actions.appendChild(reactBtn);

        const replyBtn = document.createElement('button'); replyBtn.className = 'action-btn'; replyBtn.textContent = '↩️ Reply';
        replyBtn.onclick = () => initiateReply(data._id, displayAuthorName, textDiv.querySelector('.msg-text-content'));
        actions.appendChild(replyBtn);

        if (canManageMsg) {
            const editBtn = document.createElement('button'); editBtn.className = 'action-btn'; editBtn.textContent = '✏️ Edit';
            editBtn.onclick = () => initiateEdit(data._id, textDiv.querySelector('.msg-text-content'));
            actions.appendChild(editBtn);
            
            const delBtn = document.createElement('button'); delBtn.className = 'action-btn del'; delBtn.textContent = '🗑️ Delete';
            delBtn.onclick = async () => {
                if (!currentServerCode) return;
                const payload = compositionContextCoordinator.payload({ id: data._id });
                if (payload && await showAppConfirm("Delete Message", "Delete this message?", "Delete", true) &&
                    compositionContextCoordinator.matches(payload)) {
                    socket.emit('delete_message', payload);
                }
            };
            actions.appendChild(delBtn);
        }
        if (!isMe) {
            const reportBtn = document.createElement('button');
            reportBtn.className = 'action-btn';
            reportBtn.textContent = '🚩 Report Message';
            reportBtn.onclick = () => openReportPrompt(data.username, data._id);
            actions.appendChild(reportBtn);
        }
        wrapper.appendChild(actions);

        if (data.text) {
            const { html, autoEmbeds, isPinged } = formatMessageText(data.text);
            
            const spanContent = document.createElement('span');
            spanContent.className = 'msg-text-content';
            spanContent.innerHTML = html;
            textDiv.appendChild(spanContent);
            
            autoEmbeds.forEach(src => {
                const imgEl = document.createElement('img');
                imgEl.src = src; imgEl.className = 'chat-img auto-embed-img';
                imgEl.onclick = () => window.open(src, '_blank');
                const br = document.createElement('br'); br.className = 'auto-embed-br';
                spanContent.appendChild(br); spanContent.appendChild(imgEl);
            });
            
            // Only Highlight the Full Message specifically IF the ping target was YOU.
            if (isPinged && !isMe) wrapper.classList.add('pinged');

            if (data.edited) {
                const tag = document.createElement('span'); tag.className = 'edited-tag'; tag.textContent = '(edited)';
                if (canManageMsg) { tag.title = "View edit history"; tag.onclick = () => viewHistory(data._id); } 
                else { tag.style.cursor = 'default'; }
                textDiv.appendChild(tag);
            }
        }
        
        const safeAttachment = ChatClientHelpers.sanitizeAttachment(data.attachment);
        if (safeAttachment) {
            if(data.text) textDiv.appendChild(document.createElement('br'));
            const imgEl = document.createElement('img');
            imgEl.src = safeAttachment;
            imgEl.className = 'chat-img attached-img';
            imgEl.onclick = () => window.open(safeAttachment, '_blank', 'noopener,noreferrer');
            textDiv.appendChild(imgEl);
        }

        bodyDiv.appendChild(textDiv); 
        
        const reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'msg-reactions';
        if (data.reactions && Object.keys(data.reactions).length > 0) {
            renderReactions(reactionsContainer, data.reactions, data._id);
        }
        bodyDiv.appendChild(reactionsContainer);

        wrapper.appendChild(avatarDiv); wrapper.appendChild(bodyDiv);
        chatWindow.insertBefore(wrapper, before);
        if (renderPolicy.shouldScroll) chatScrollCoordinator.request(renderPolicy.behavior);
        return wrapper;
    }

    function appendSystemMessage(txt) {
        const wasNearBottom = ChatClientHelpers.isNearScrollEnd(chatWindow);
        const el = document.createElement('div'); el.className = 'system-msg'; el.textContent = txt;
        chatWindow.appendChild(el);
        if (wasNearBottom) chatScrollCoordinator.request('smooth');
    }

    function updateTypingUI() {
        const ind = document.getElementById('typing-indicator');
        if (typingUsers.size === 0) {
            ind.classList.remove('show');
            // Timeout securely clears DOM structural text so it collapses flawlessly.
            setTimeout(() => { if (!ind.classList.contains('show')) ind.textContent = ''; }, 200); 
        } else {
            ind.classList.add('show');
            
            if (typingUsers.size === 1) {
                const typedUsername = Array.from(typingUsers.keys())[0];
                const dName = typingUsers.get(typedUsername);
                ind.textContent = `${dName} is typing...`;
            }
            else ind.textContent = 'Multiple people are typing...';
        }
    }
</script>
