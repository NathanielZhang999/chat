            if (!reason || reason.length > 300) return null;
            const payload = { serverCode: input.serverCode, targetUser: input.targetUser };
            if (input.messageId !== undefined && input.messageId !== null) {
                if (typeof input.messageId !== 'string' || !input.messageId) return null;
                payload.messageId = input.messageId;
            }
            payload.reason = reason;
            return payload;
        },

        dispatchModerationReport(socket, input, callback) {
            const payload = this.normalizeReportPrompt(input);
            if (!payload || !socket || typeof socket.emit !== 'function') return null;
            socket.emit('report_moderation_target', payload, callback);
            return payload;
        },

        normalizeResolutionPrompt(input) {
            const statuses = new Set(['resolved', 'dismissed']);
            if (!input || typeof input.serverCode !== 'string' || !input.serverCode ||
                typeof input.reportId !== 'string' || !input.reportId ||
                !statuses.has(input.status) || typeof input.resolution !== 'string') return null;
            const resolution = input.resolution.normalize('NFKC').trim();
            if (!resolution || resolution.length > 300) return null;
            return {
                serverCode: input.serverCode,
                reportId: input.reportId,
                status: input.status,
                resolution
            };
        },

        normalizeAutoModPrompt(input) {
            if (!input || typeof input.keywordsText !== 'string') return null;
            const candidateKeywords = input.keywordsText
                .split(/\r?\n/)
                .map(value => value.normalize('NFKC').trim().toLowerCase())
                .filter(Boolean);
            const blockedKeywords = candidateKeywords.slice(0, 50);
            const settings = {
                blockedKeywords,
                mentionLimit: Number(input.mentionLimit),
                repeatLimit: Number(input.repeatLimit),
                repeatWindowSeconds: Number(input.repeatWindowSeconds)
            };
            const bounds = {
                mentionLimit: [1, 20],
                repeatLimit: [2, 10],
                repeatWindowSeconds: [5, 300]
            };
            const invalidNumber = Object.entries(bounds).some(([key, [min, max]]) =>
                !Number.isInteger(settings[key]) || settings[key] < min || settings[key] > max);
            const invalidKeywords = candidateKeywords.length > 50 ||
                blockedKeywords.some(value => value.length < 1 || value.length > 40);
            return invalidNumber || invalidKeywords ? null : settings;
        },

        restrictionActionsFor(restriction) {
            if (!restriction) return [];
            const actions = [];
            if (restriction.banned) actions.push('unban');
            if (restriction.timedOut) actions.push('clear_timeout');
            return actions;
        },

        appendSafeModerationRow(doc, list, titleText, detailText) {
            const row = doc.createElement('article');
            row.className = 'moderator-row';
            const title = doc.createElement('div');
            title.className = 'moderator-row-title';
            title.textContent = titleText == null ? '' : String(titleText);
            const detail = doc.createElement('div');
            detail.className = 'moderator-row-detail';
            detail.textContent = detailText == null ? '' : String(detailText);
            row.appendChild(title);
            row.appendChild(detail);
            list.appendChild(row);
            return { row, title, detail };
        },

        appendModerationItemRow(doc, list, kind, item, formatDate) {
            if (!item || typeof formatDate !== 'function') return null;
            let titleText;
            let detailText;
            if (kind === 'report') {
                titleText = `@${item.targetUsername || 'Unknown'} — ${item.status || 'open'}`;
                detailText = `Reported by @${item.reporterUsername || 'Unknown'}${item.messageId ? `\nMessage: ${item.messageId}` : ''}\nReason: ${item.reason || ''}\nCreated: ${formatDate(item.createdAt)}`;
            } else if (kind === 'restriction') {
                const states = [item.banned ? 'Banned' : '', item.timedOut ? 'Timed out' : ''].filter(Boolean);
                const details = [];
                if (item.banned) details.push(

        createRestrictionCoordinator({ schedule, cancel, now, getCurrentRoom, applyState }) {
            let timerId = null;

            return {
                clear() {

                },

                    const capturedRoom = roomCode;
                    const timeoutUntil = restriction && restriction.timeoutUntil !== null &&
                        restriction.timeoutUntil !== undefined
                        ? new Date(restriction.timeoutUntil).getTime()
                        : NaN;
                    const timedOut = Boolean(restriction && restriction.timedOut &&
                        Number.isFinite(timeoutUntil) && timeoutUntil > now());
                    applyState({
                        timedOut,
                        timeoutUntil: timedOut ? timeoutUntil : null,
                        roomCode,
                        version: capturedVersion
                    });
                    if (!timedOut) return;
                    timerId = schedule(() => {
                        if (getCurrentRoom() !== capturedRoom || version !== capturedVersion) return;
                        timerId = null;
                        version += 1;
                        applyState({ timedOut: false, timeoutUntil: null, roomCode, version });

        createModeratorCenterCoordinator({ onPendingChange = () => {} } = {}) {
            let epoch = 0;
            let room = null;
            let view = null;
            let nextRequestId = 0;
            const latestByKey = new Map();
            const pendingKeys = new Set();

            const clearRequests = () => {
                for (const key of pendingKeys) onPendingChange(key, false);
                latestByKey.clear();
                pendingKeys.clear();
            };

            return {
                open(nextRoom, nextView = 'reports') {
                    epoch += 1;
                    clearRequests();
                    room = nextRoom;
                    view = nextView;
                    return epoch;
                },
                close() {
                    epoch += 1;
                    clearRequests();
                    room = null;
                    view = null;
                    return epoch;
                },
                selectView(nextView) {
                    epoch += 1;
                    clearRequests();
                    view = nextView;
                    return epoch;
                },
                beginRequest(request, blockWhilePending = false) {
                    if (!request || !room || request.roomCode !== room || request.view !== view) return null;
                    if (blockWhilePending && pendingKeys.has(request.key)) return null;
                    const requestId = ++nextRequestId;
                    const token = Object.freeze({
                        epoch,
                        room,
                        view,
                        key: request.key,
                        identity: request.identity,
                        requestId
                    });
                    latestByKey.set(request.key, token);
                    if (!pendingKeys.has(request.key)) {
                        pendingKeys.add(request.key);
                        onPendingChange(request.key, true);
                    }
                    return token;
                },
                finishRequest(token) {
                    const latest = token && latestByKey.get(token.key);
                    const current = Boolean(token && latest &&
                        token.epoch === epoch && token.room === room && token.view === view &&
                        latest.requestId === token.requestId && latest.identity === token.identity);
                    if (!current) return false;
                    latestByKey.delete(token.key);
                    pendingKeys.delete(token.key);
                    onPendingChange(token.key, false);
                    return true;
                },
                isPending(key) { return pendingKeys.has(key); },
                current() { return { epoch, room, view }; }

        sanitizeAttachment(value) {
            if (typeof value !== 'string' || value.length === 0 || value.length > 8000000) return null;

        formatTrustedPings(text, username, displayName) {
            let isPinged = false;
            const html = String(text || '').replace(
                /(?<!\{)\{\{PING:([A-Za-z0-9_-]{1,20})\|([A-Za-z0-9_ -]{1,30})\}\}(?!\})/g,
                (match, pingUsername, pingDisplayName) => {
                    const isEveryone = pingUsername === 'everyone' && pingDisplayName === 'everyone';
                    if ((pingUsername === 'everyone' || pingDisplayName === 'everyone') && !isEveryone) return match;
                    if (pingUsername === username || pingDisplayName === displayName || isEveryone) isPinged = true;
                    return isEveryone
                        ? '<span class="ping-tag everyone">@everyone</span>'
                        : `<span class="ping-tag">@${pingDisplayName}</span>`;
                }
            );
            return { html, isPinged };
        },

        hasTrustedPing(text, username, displayName) {
            const tokenPattern = /(?<!\{)\{\{PING:([A-Za-z0-9_-]{1,20})\|([A-Za-z0-9_ -]{1,30})\}\}(?!\})/g;
            let match;
            while ((match = tokenPattern.exec(String(text || ''))) !== null) {
                const isEveryone = match[1] === 'everyone' && match[2] === 'everyone';
                if ((match[1] === 'everyone' || match[2] === 'everyone') && !isEveryone) continue;
                if (match[1] === username || match[2] === displayName || isEveryone) return true;
            }
            return false;
        },

            getCurrentSocket,

            currentServerCode,
            targetServerCode,
            response,
            showAlert,
            applySuccess
        }) {
            const normalizedResponse = response || { error: 'No response from server.' };
            if (normalizedResponse.error) {
                showAlert('Error', normalizedResponse.error);
                return { accepted: false, currentServerCode, response: normalizedResponse };
            }
            applySuccess(targetServerCode, normalizedResponse);
            return { accepted: true, currentServerCode: targetServerCode, response: normalizedResponse };
        },

        createSwitchCoordinator(emitSwitch, handleResult) {
            let inFlightTarget = null;
            let queuedTarget = null;

            const start = target => {
                inFlightTarget = target;
                emitSwitch(target, result => {
                    try {
                        handleResult(target, result);
                    } finally {
                        const completedTarget = inFlightTarget;
                        const completedSuccessfully = Boolean(result && !result.error);
                        const nextTarget = queuedTarget;
                        inFlightTarget = null;
                        queuedTarget = null;
                        if (nextTarget !== null &&
                            !(completedSuccessfully && nextTarget === completedTarget)) {
                            start(nextTarget);
                        }
                    }
                });
            };

            return {
                isPending() {
                    return inFlightTarget !== null;
                },
                request(target) {
                    if (inFlightTarget !== null) {
                        queuedTarget = target;
                        return;
                    }
                    start(target);
                }
            };
        },

            if (!element) return false;
            const remaining = element.scrollHeight - element.scrollTop - element.clientHeight;
            return remaining <= threshold;
        },

        messageRenderPolicy({ history = false, wasNearBottom = false } = {}) {

        createScrollCoordinator(scheduleFrame, getScroller, shouldReduceMotion = () => false) {
            let scheduled = false;
            let pendingBehavior = null;

            return {
                request(behavior = 'smooth') {
                    pendingBehavior = pendingBehavior === 'auto' || behavior === 'auto' ? 'auto' : 'smooth';
                    if (scheduled) return;
                    scheduled = true;
                    scheduleFrame(() => {
                        const requestedBehavior = pendingBehavior;
                        pendingBehavior = null;
                        scheduled = false;
                        const scroller = getScroller();
                        if (!scroller) return;
                        const behavior = requestedBehavior === 'smooth' && shouldReduceMotion()
                            ? 'auto'
                            : requestedBehavior;
                        scroller.scrollTo({ top: scroller.scrollHeight, behavior });
                    });
                }
            };
        }
    };

        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
        if (type === 'ping') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'msg') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        }

        const loadedMessage = [...document.querySelectorAll('.msg[data-id]')]
            .find(row => row.getAttribute('data-id') === String(messageId));
        if (!loadedMessage) {
            messageSearchStatus.textContent = 'This message is outside the loaded history.';
            return false;
        }
        closeMessageSearch();
        loadedMessage.scrollIntoView({
            block: 'center',
            behavior: prefersReducedMotion() ? 'auto' : 'smooth'
        });
        loadedMessage.classList.add('search-highlight');
        setTimeout(() => loadedMessage.classList.remove('search-highlight'), 1800);
        return true;
    }

    function renderSearchResults(results) {
        messageSearchResults.textContent = '';
        const values = Array.isArray(results) ? results : [];
        const rendered = values.map(result => ChatClientHelpers.appendSearchResultRow(
            document,
            messageSearchResults,
            result,
            { formatDate: formatExactDate, onSelect: selectSearchResult }
        )).filter(Boolean);
        messageSearchStatus.textContent = rendered.length
            ? `${rendered.length} ${rendered.length === 1 ? 'result' : 'results'}.`
            : 'No messages found.';
        return rendered;
    }

    function submitMessageSearch() {
        const query = ChatClientHelpers.normalizeMessageSearchQuery(messageSearchInput.value);
        if (!query) {
            messageSearchStatus.textContent = 'Enter 2–80 characters.';
            return false;
        }
        if (searchRequestHandle) searchRequestHandle.cancel();
        searchRequestHandle = null;
        messageSearchResults.textContent = '';
        messageSearchStatus.textContent = 'Searching…';
        const requestHandle = ChatClientHelpers.requestMessageSearch({
            coordinator: messageReadCoordinator,
            socket,
            query,
            scheduleTimeout: scheduleSearchAckTimeout,
            cancelTimeout: cancelSearchAckTimeout,
            timeoutMs: searchRequestTimeoutMs,
            onTimeout() {
                searchRequestHandle = null;
                messageSearchStatus.textContent = 'Search timed out. Try again.';
            },
            onAccepted(response) {
                searchRequestHandle = null;
                renderSearchResults(response.results);
            }
        });
        searchRequestHandle = requestHandle || null;
        if (!requestHandle) {
            messageSearchStatus.textContent = 'Search unavailable. Please try again.';
            return false;
        }
        return true;
    }

    function handleMessageSearchKeydown(event) {
        if (!event || event.key !== 'Enter') return false;
        event.preventDefault();
        return submitMessageSearch();
    }

    function handleMessageSearchModalKeydown(event) {
        if (!event || !messageSearchModal.classList.contains('active')) return false;
        if (event.key === 'Escape') {
            event.preventDefault();
            closeMessageSearch();
            return true;
        }
        if (event.key !== 'Tab') return false;
        const focusable = messageSearchFocusableElements();
        if (focusable.length === 0) {
            event.preventDefault();
            return true;
        }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        const active = typeof document === 'undefined' ? null : document.activeElement;
        if (event.shiftKey && (active === first || !focusable.includes(active))) {
            event.preventDefault();
            last.focus();
            return true;
        }
        if (!event.shiftKey && (active === last || !focusable.includes(active))) {
            event.preventDefault();
            first.focus();
            return true;
        }
        return false;
    }

    function invalidateRevokedRoomState(data) {
        if (!currentServerCode || !data) return false;
        const stillAccessible = ChatClientHelpers.isRoomRailAccessible({
            serverCode: currentServerCode,
            role: myRole,
            joinedServers: myJoinedServers,
            bannedRooms: Array.isArray(data.bannedRooms) ? data.bannedRooms : [...myBannedRooms]
        });

    function renderServerAccess() {
        document.querySelectorAll('.server-icon').forEach(icon => {
            if (icon.classList.contains('add-btn')) return;
            const code = icon.id === 'srv-global' ? 'global' : icon.id.replace(/^srv-/, '');
            const banned = myBannedRooms.has(code);
            const accessible = ChatClientHelpers.isRoomRailAccessible({
                serverCode: code,
                role: myRole,
                joinedServers: myJoinedServers,
                bannedRooms: [...myBannedRooms]
            });
            icon.setAttribute('aria-disabled', accessible ? 'false' : 'true');
            if (!accessible) {
                icon.title = banned ? 'You are banned from this room' : 'Join this room to open it';
                icon.classList.remove('active');
            } else {
                icon.removeAttribute('title');
            }
            if (code !== 'global' && myRole === 'admin' && !myJoinedServers.includes(code) && !banned) {
                icon.style.opacity = '0.4';
                icon.style.border = '1px dashed #8e9297';

    function openModerationPrompt({ targetUsername, action, roomCode = currentServerCode, onSuccess = null }) {
        if (!targetUsername || !roomCode || !moderationActionLabels[action]) return;
        const identity = JSON.stringify({ roomCode, targetUsername, action });
        moderationDialogCoordinator.open(identity);

    function submitModerationAction() {
        if (!selectedModerationRequest) return;
        const request = selectedModerationRequest;
        if (currentServerCode !== request.roomCode && moderatorCenterRoom !== request.roomCode) {
            closeModerationPrompt();
            return;
        }
        const normalized = ChatClientHelpers.normalizeModerationPrompt({
            action: request.action,
            reason: document.getElementById('moderation-reason').value,
            duration: document.getElementById('moderation-duration').value
        });
        if (!normalized) {
            document.getElementById('moderation-action-error').textContent =
                'Enter a reason of 1–200 characters and choose a valid duration.';
            return;
        }
        const token = moderationDialogCoordinator.begin(request.identity);
        if (!token) return;
        socket.emit('moderate_user', {
            serverCode: request.roomCode,
            targetUser: request.targetUsername,
            action: normalized.action,
            duration: normalized.duration,
            reason: normalized.reason
        }, response => {
            if (!moderationDialogCoordinator.finish(token)) return;
            const result = response || { error: 'No response from server.' };
            if (result.error) {
                showAppAlert('Moderation failed', result.error);
                return;
            }
            closeModerationPrompt();
            showAppAlert('Moderation applied', 'The room restriction was updated.');
            if (typeof request.onSuccess === 'function') request.onSuccess();
        });
    }

        reportDialogCoordinator.open(identity);

            : `Report @${targetUsername} in ${currentServerCode}`;

        document.getElementById('report-error').textContent = '';
        document.getElementById('report-modal').classList.add('active');
        document.getElementById('report-reason').focus();

    function submitReport() {
        if (!selectedReportRequest) return;
        const request = selectedReportRequest;
        const payload = ChatClientHelpers.normalizeReportPrompt({
            serverCode: request.roomCode,
            targetUser: request.targetUsername,
            messageId: request.messageId || undefined,
            reason: document.getElementById('report-reason').value
        });
        if (!payload) {
            document.getElementById('report-error').textContent = 'Enter a reason of 1–300 characters.';
            return;

        if (currentServerCode !== request.roomCode) {
            closeReportPrompt();

        const token = reportDialogCoordinator.begin(request.identity);
        if (!token) return;
        ChatClientHelpers.dispatchModerationReport(socket, payload, response => {

            const result = response || { error: 'No response from server.' };
            if (result.error) return showAppAlert('Report failed', result.error);
            closeReportPrompt();
            showAppAlert('Report submitted', 'Moderators can now review this report.');
        });

    function loadModeratorCenterTab(tab = moderatorCenterTab, before = null, append = false) {
        const requestedRoom = moderatorCenterRoom;
        const modal = document.getElementById('moderator-center-modal');
        if (!requestedRoom || currentServerCode !== requestedRoom || !modal.classList.contains('active')) return;
        const request = ChatClientHelpers.moderatorCenterRequestFor({
            tab,
            roomCode: requestedRoom,
            status: document.getElementById('moderator-report-status').value,
            before,
            append
        });
        if (!request) return;
        const renderers = {
            reports: renderModerationReports,
            restrictions: renderRoomRestrictions,
            audit: renderModerationAudit,
            automod: renderAutoModSettings
        };
        ChatClientHelpers.dispatchModeratorCenterRequest({
            coordinator: moderatorCenterCoordinator,
            socket,
            request,
            blockWhilePending: append,
            apply(response) {
                renderers[tab](response, append);
            }
        });
    }

    function renderModerationReports(response, append = false) {
        const list = document.getElementById('moderator-reports-list');
        if (!append) list.textContent = '';
        if (response.error) {
            const errorRow = document.createElement('div');
            errorRow.className = 'moderator-row-detail';
            errorRow.textContent = response.error;
            list.appendChild(errorRow);
        } else {
            for (const report of Array.isArray(response.items) ? response.items : []) {
                const { row } = ChatClientHelpers.appendModerationItemRow(
                    document, list, 'report', report, formatExactDate
                );
                if (report.status === 'open') {
                    const actions = document.createElement('div');
                    actions.className = 'moderator-row-actions';
                    for (const [status, label, danger] of [
                        ['resolved', 'Resolve', false],
                        ['dismissed', 'Dismiss', true]
                    ]) {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.textContent = label;
                        if (danger) button.className = 'danger';
                        button.onclick = () => openResolutionPrompt(report, status);
                        actions.appendChild(button);
                    }
                    row.appendChild(actions);
                } else if (report.resolution) {
                    const resolution = document.createElement('div');
                    resolution.className = 'moderator-row-detail';
                    resolution.textContent = `Resolution by @${report.resolvedBy || 'Unknown'}: ${report.resolution}`;
                    row.appendChild(resolution);
                }
            }
            if (!list.children.length) {
                const empty = document.createElement('div');
                empty.className = 'moderator-row-detail';
                empty.textContent = 'No reports found.';
                list.appendChild(empty);
            }
        }
        moderatorCenterCursors.reports = response.nextCursor || null;
        document.getElementById('moderator-reports-more').style.display =
            moderatorCenterCursors.reports ? 'block' : 'none';
    }

    function renderRoomRestrictions(response, append = false) {
        const list = document.getElementById('moderator-restrictions-list');
        if (!append) list.textContent = '';
        if (response.error) {
            const errorRow = document.createElement('div');
            errorRow.className = 'moderator-row-detail';
            errorRow.textContent = response.error;
            list.appendChild(errorRow);
        } else {
            for (const restriction of Array.isArray(response.items) ? response.items : []) {
                const { row } = ChatClientHelpers.appendModerationItemRow(
                    document, list, 'restriction', restriction, formatExactDate
                );
                const actions = document.createElement('div');
                actions.className = 'moderator-row-actions';
                const roomCode = moderatorCenterRoom;
                const refresh = () => {
                    if (currentServerCode === roomCode && moderatorCenterRoom === roomCode) {
                        loadModeratorCenterTab('restrictions');
                    }
                };
                for (const action of ChatClientHelpers.restrictionActionsFor(restriction)) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = moderationActionLabels[action];
                    button.onclick = () => openModerationPrompt({
                        targetUsername: restriction.targetUsername,
                        action,
                        roomCode,
                        onSuccess: refresh
                    });
                    actions.appendChild(button);
                }
                row.appendChild(actions);
            }
            if (!list.children.length) {
                const empty = document.createElement('div');
                empty.className = 'moderator-row-detail';
                empty.textContent = 'No active restrictions.';
                list.appendChild(empty);

        document.getElementById('moderator-restrictions-more').style.display =

    function loadAutoModSettings(requestedRoom = moderatorCenterRoom) {
        if (!requestedRoom || requestedRoom !== moderatorCenterRoom) return;
        loadModeratorCenterTab('automod');

    function renderAutoModSettings(result) {
        if (result.error || !result.autoMod) {
            document.getElementById('automod-error').textContent = result.error || 'Invalid AutoMod response.';
            return;
        }
        const autoMod = result.autoMod;
        document.getElementById('automod-keywords').value = Array.isArray(autoMod.blockedKeywords)
            ? autoMod.blockedKeywords.slice(0, 50).join('\n')
            : '';
        document.getElementById('automod-mention-limit').value = autoMod.mentionLimit;
        document.getElementById('automod-repeat-limit').value = autoMod.repeatLimit;
        document.getElementById('automod-repeat-window').value = autoMod.repeatWindowSeconds;
        document.getElementById('automod-error').textContent = '';
    }

    function saveAutoModSettings() {
        const requestedRoom = moderatorCenterRoom;
        if (!requestedRoom || currentServerCode !== requestedRoom) return;
        const settings = ChatClientHelpers.normalizeAutoModPrompt({
            keywordsText: document.getElementById('automod-keywords').value,
            mentionLimit: document.getElementById('automod-mention-limit').value,
            repeatLimit: document.getElementById('automod-repeat-limit').value,
            repeatWindowSeconds: document.getElementById('automod-repeat-window').value
        });
        if (!settings) {
            document.getElementById('automod-error').textContent =
                'Use up to 50 keywords (1–40 characters each) and values within the displayed bounds.';
            return;
        }
        const payload = { serverCode: requestedRoom, ...settings };
        ChatClientHelpers.dispatchModeratorCenterRequest({
            coordinator: moderatorCenterCoordinator,
            socket,
            request: ChatClientHelpers.moderatorCenterMutationRequestFor('automod', payload),
            apply(result) {
                if (result.error) {
                    document.getElementById('automod-error').textContent = result.error;
                    return;
                }
                document.getElementById('automod-error').textContent = 'AutoMod settings saved.';
                loadAutoModSettings(requestedRoom);
            }
        });

    function openResolutionPrompt(report, status) {
        if (!report || !['resolved', 'dismissed'].includes(status) || !moderatorCenterRoom) return;
        const roomCode = moderatorCenterRoom;
        const identity = JSON.stringify({ roomCode, reportId: report._id, status });
        resolutionDialogCoordinator.open(identity);
        selectedResolutionRequest = { reportId: report._id, status, roomCode, identity };
        document.getElementById('resolution-confirm').disabled = false;

        document.getElementById('resolution-context').textContent = ChatClientHelpers.roomScopedConfirmation({
            verb: status === 'resolved' ? 'Resolve' : 'Dismiss',

            roomCode
        });

    function submitResolution() {
        if (!selectedResolutionRequest) return;
        const request = selectedResolutionRequest;
        const payload = ChatClientHelpers.normalizeResolutionPrompt({
            serverCode: request.roomCode,
            reportId: request.reportId,
            status: request.status,
            resolution: document.getElementById('resolution-reason').value
        });
        if (!payload) {
            document.getElementById('resolution-error').textContent = 'Enter a resolution of 1–300 characters.';
            return;
        }
        if (currentServerCode !== request.roomCode || moderatorCenterRoom !== request.roomCode) {
            closeResolutionPrompt();
            return;
        }
        const token = resolutionDialogCoordinator.begin(request.identity);
        if (!token) return;
        socket.emit('resolve_moderation_report', payload, response => {
            if (!resolutionDialogCoordinator.finish(token)) return;
            const result = response || { error: 'No response from server.' };
            if (result.error) {

    document.getElementById('file-upload').addEventListener('change', async (e) => {
        if (compositionDisabled) return;
        const file = e.target.files[0]; if (!file) return;
        if (!file.type.startsWith('image/')) return showAppAlert("Error", "Only image files are allowed.");
        
        if(file.size > 10 * 1024 * 1024) return showAppAlert("Error", "File too large. Max 10MB before compression.");
        const uploadContext = compositionContextCoordinator.payload();
        if (!uploadContext) return;
        const uploadEpoch = ++attachmentLoadEpoch;
        const isCurrentUpload = () => uploadEpoch === attachmentLoadEpoch &&
            !compositionDisabled && compositionContextCoordinator.matches(uploadContext);
        
        const reader = new FileReader();
        reader.onload = (event) => {
            if (!isCurrentUpload()) return;
            const img = new Image();
            img.onload = () => {
                if (!isCurrentUpload()) return;
                const canvas = document.createElement('canvas');
                let w = img.width; let h = img.height;
                const max = 800; 
                if (w > h && w > max) { h *= max / w; w = max; }
                else if (h > max) { w *= max / h; h = max; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                
                pendingAttachmentBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('preview-img').src = pendingAttachmentBase64;
                document.getElementById('attachment-preview').classList.add('show');
                msgInput.focus();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // --- HTML ESCAPE & BACKEND SMART PING PARSING ---
    function formatMessageText(text) {
        let safeText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        let autoEmbeds = [];
        safeText = safeText.replace(/(https?:\/\/[^\s]+)/g, (match) => {
            if (/\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i.test(match)) {
                let decodedUrl = match.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
                autoEmbeds.push(decodedUrl);
            }
            return `<a href="${match}" target="_blank" rel="noopener noreferrer" class="chat-link">${match}</a>`;
        });

        safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');     
        safeText = safeText.replace(/\*(.*?)\*/g, '<em>$1</em>');                 
        safeText = safeText.replace(/__(.*?)__/g, '<u>$1</u>');                   
        safeText = safeText.replace(/~~(.*?)~~/g, '<del>$1</del>');               
        safeText = safeText.replace(/`(.*?)`/g, '<code>$1</code>');               

        const pingResult = ChatClientHelpers.formatTrustedPings(safeText, myUsername, myDisplayName);
        safeText = pingResult.html;

        return { html: safeText, autoEmbeds: autoEmbeds, isPinged: pingResult.isPinged };
    }

        const previousSocket = socket;

    authBtn.addEventListener('click', () => {
        const rawUrl = document.getElementById('url-input').value.trim();
        const user = document.getElementById('username-input').value.trim();
        const pass = document.getElementById('password-input').value;
        const dName = document.getElementById('displayname-input').value.trim();

        if (!rawUrl || !user || !pass) return showError('All required fields missing.', false);
        if (!isLoginMode && !dName) return showError('Please set a Display Name.', false);

        const url = ChatClientHelpers.normalizeBackendUrl(rawUrl);

        localStorage.setItem('pro_chat_user', user);
        
        authError.style.color = "var(--text)"; authError.textContent = "Connecting to server..."; authBtn.disabled = true;

        const authSocket = replaceClientSocket(url);

        const action = isLoginMode ? 'login' : 'register';
        const payload = isLoginMode ? { username: user, password: pass } : { username: user, password: pass, displayName: dName };
        
        const doAuth = () => {
            authSocket.emit(action, payload, (res) => {
                if (authSocket !== socket) return;
                authBtn.disabled = false;
                res = res || { error: 'No response from server.' };
                if (res.error) return showError(res.error, false);
                
                if (action === 'register') {
                    showError("Registered! You can now log in.", true);
                    document.getElementById('password-input').value = "";
                    setTimeout(() => document.getElementById('tab-login').click(), 1000);
                } else {
                    myUsername = res.username;
                    myDisplayName = res.displayName || res.username;
                    myRole = res.role || 'user';
                    myRoomRole = 'user'; 
                    myJoinedServers = res.joinedServers || ['global'];
                    roomAccessCoordinator.replaceBannedRooms(res.bannedRooms || []);
                    myAvatarUrl = res.avatarUrl || ''; 
                    myColor = res.color || '';
                    
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    document.getElementById('auth-modal').classList.remove('active');
                    renderServers(res.servers || []);
                    const initialCode = Object.prototype.hasOwnProperty.call(res, 'defaultServerCode')
                        ? res.defaultServerCode : 'global';
                    applyRestrictionState(res.restriction, initialCode);
                    if (initialCode) switchServer(initialCode);
                    else enterLobby();
                }
            });
        };
        if (pendingAuthSocket && pendingAuthConnectHandler) {
            pendingAuthSocket.off('connect', pendingAuthConnectHandler);
            pendingAuthSocket = null;
            pendingAuthConnectHandler = null;
        }
        if (authSocket.connected) {
            doAuth();
        } else {
            pendingAuthSocket = authSocket;
            pendingAuthConnectHandler = () => {
                pendingAuthSocket = null;
                pendingAuthConnectHandler = null;
                doAuth();
            };
            authSocket.once('connect', pendingAuthConnectHandler);
        }
    });
